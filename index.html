          while (musicNextStepTime < audio.currentTime + MUSIC_LOOKAHEAD) {
            scheduleBackgroundMusicStep(audio, musicStep, musicNextStepTime);
            musicStep = (musicStep + 1) % MUSIC_LOOP_STEPS;
            musicNextStepTime += MUSIC_BEAT_SECONDS;
          }
        }

        function startBackgroundMusic() {
          const audio = getBattleAudio();
          if (!audio) return;
          applyAudioSettings();
          if (musicTimer) return;
          musicStep = 0;
          musicNextStepTime = audio.currentTime + 0.05;
          playMusicStep();
          musicTimer = window.setInterval(playMusicStep, 250);
        }

        function stopBackgroundMusic() {
          if (musicTimer) {
            window.clearInterval(musicTimer);
            musicTimer = null;
          }
          musicNextStepTime = 0;
          applyAudioSettings();
        }

        function pushBattleParticle(effect) {
          const battle = state.battle;
          if (!battle) return;
          battle.effects ||= [];
          battle.effects.push(effect);
          if (battle.effects.length > 96) battle.effects.splice(0, battle.effects.length - 96);
        }

        function spawnBattleBurst(x, y, count, colors, options = {}) {
          const spread = options.spread ?? Math.PI * 2;
          const baseAngle = options.angle ?? 0;
          const speed = options.speed ?? 130;
          for (let i = 0; i < count; i++) {
            const angle = baseAngle + (Math.random() - 0.5) * spread;
            const force = randRange(speed * 0.35, speed);
            pushBattleParticle({
              type: options.type || "spark",
              x,
              y,
              vx: Math.cos(angle) * force,
              vy: Math.sin(angle) * force - randRange(8, 42),
              age: 0,
              maxLife: randRange(0.34, options.life ?? 0.62),
              size: randRange(options.minSize ?? 3, options.maxSize ?? 7),
              color: colors[(Math.random() * colors.length) | 0],
              gravity: options.gravity ?? 190,
            });
          }
        }

        function addBattleText(text, x, y, color = "#fff7d7") {
          pushBattleParticle({
            type: "text",
            text,
            x,
            y,
            vx: randRange(-12, 12),
            vy: -42,
            age: 0,
            maxLife: 0.9,
            size: 22,
            color,
            gravity: 0,
          });
        }

        function triggerBattleFeedback(kind, amount = 0) {
          const battle = state.battle;
          if (!battle) return;
          const player = { x: 238, y: 306 };
          const monster = { x: 724, y: 286 };
          battle.flash = Math.max(battle.flash || 0, kind === "enemy" ? 0.55 : 0.35);
          battle.shake = Math.max(battle.shake || 0, kind === "enemy" ? 0.72 : 0.42);
          if (kind === "strike") {
            pushBattleParticle({ type: "slash", x: monster.x - 76, y: monster.y - 52, x2: monster.x + 70, y2: monster.y + 38, age: 0, maxLife: 0.22, color: "#fff2a8", width: 12 });
            spawnBattleBurst(monster.x, monster.y, 20, ["#fff2a8", "#f7d36f", "#ff8f5f"], { speed: 230, spread: Math.PI * 1.45, angle: Math.PI, maxSize: 8 });
            addBattleText(`-${amount}`, monster.x, monster.y - 68, "#fff2a8");
          } else if (kind === "analyze") {
            for (let i = 0; i < 3; i++) pushBattleParticle({ type: "ring", x: monster.x, y: monster.y - 4, age: -i * 0.09, maxLife: 0.58, radius: 28 + i * 12, color: "#8fe6ff", width: 4 });
            spawnBattleBurst(monster.x, monster.y - 10, 18, ["#8fe6ff", "#76c6cc", "#e8f7ff"], { speed: 150, maxSize: 5, gravity: 70 });
            addBattleText(`-${amount}`, monster.x, monster.y - 68, "#8fe6ff");
          } else if (kind === "partner") {
            spawnBattleBurst(monster.x - 12, monster.y - 8, 24, ["#8fd17b", "#fff7d7", "#5fb96b"], { speed: 190, maxSize: 7, gravity: 100 });
            pushBattleParticle({ type: "ring", x: player.x - 62, y: player.y + 34, age: 0, maxLife: 0.65, radius: 34, color: "#8fd17b", width: 5 });
            addBattleText(`-${amount}`, monster.x, monster.y - 68, "#b6ffa1");
          } else if (kind === "defend") {
            battle.shake = Math.max(battle.shake || 0, 0.16);
            battle.flash = Math.max(battle.flash || 0, 0.22);
            for (let i = 0; i < 3; i++) pushBattleParticle({ type: "ring", x: player.x, y: player.y - 8, age: -i * 0.08, maxLife: 0.64, radius: 28 + i * 13, color: "#d9f0ff", width: 4 });
            addBattleText("+防禦", player.x, player.y - 82, "#d9f0ff");
          } else if (kind === "enemy") {
            spawnBattleBurst(player.x, player.y - 4, 22, ["#d14545", "#543831", "#e6c95b"], { speed: 210, spread: Math.PI * 1.35, angle: 0, maxSize: 9, gravity: 230 });
            addBattleText(`-${amount}`, player.x, player.y - 88, "#ffb4a8");
          }
          playBattleSound(kind, amount ? amount / 12 : 1);
        }

        function updateBattleEffects(dt) {
          const battle = state.battle;
          if (!battle) return;
          battle.flash = Math.max(0, (battle.flash || 0) - dt * 1.85);
          battle.shake = Math.max(0, (battle.shake || 0) - dt * 2.6);
          battle.effects ||= [];
          for (const effect of battle.effects) {
            effect.age += dt;
            if (effect.age < 0) continue;
            effect.x += (effect.vx || 0) * dt;
            effect.y += (effect.vy || 0) * dt;
            effect.vy = (effect.vy || 0) + (effect.gravity || 0) * dt;
          }
          battle.effects = battle.effects.filter((effect) => effect.age < effect.maxLife);
        }

        function battleMonster() {
          return state.battle ? state.monsters.find((monster) => monster.uid === state.battle.monsterUid) : null;
        }

        function pushBattleLog(text) {
          if (!state.battle) return;
          state.battle.log.unshift(text);
          state.battle.log = state.battle.log.slice(0, 5);
          uiDirty = true;
        }

        function startBattle(monster) {
          if (state.battle || state.recycleGame) return;
          state.fieldAction = null;
          monster.hp = monster.hp || monsterMaxHp(monster.stage, monster.absorbed);
          state.battle = {
            monsterUid: monster.uid,
            playerHp: state.health,
            monsterHp: monster.hp,
            defending: false,
            weakened: false,
            effects: [],
            flash: 0.18,
            shake: 0.18,
            log: [`第 ${monster.stage} 階垃圾怪靠近了。`],
          };
          playBattleSound("enemy", 0.8);
          state.dialogue = null;
          hudPills.hidden = true;
          dialogueEl.hidden = true;
          uiDirty = true;
        }

        function performBattleAction(key) {
          const battle = state.battle;
          const monster = battleMonster();
          if (!battle || !monster) return;
          let damage = 0;
          let message = "";
          let feedback = "";
          if (key === "1") {
            damage = 10 + partnerCount() * 2 + Math.floor(state.recyclePoints / 80);
            message = `你用夾具和垃圾袋做淨化打擊，造成 ${damage} 傷害。`;
            feedback = "strike";
          } else if (key === "2") {
            const practiced = state.recycleStats.played > 0;
            const perfectBoost = state.recycleStats.perfect > 0 ? 5 : 0;
            const manualBoost = state.completedMissions["first-recycle"] ? 3 : 0;
            damage = practiced ? 9 + perfectBoost + manualBoost : 5;
            battle.weakened = practiced;
            feedback = "analyze";
            message = practiced
              ? `你辨識牠身上的回收物弱點，造成 ${damage} 傷害，並降低下一次攻擊。`
              : `你還沒練過回收分類，只能粗略判斷，造成 ${damage} 傷害。`;
          } else if (key === "3") {
            const partners = partnerCount();
            if (!partners) {
              pushBattleLog("還沒有生態夥伴。先觀察動物、累積信任，就能在戰鬥中獲得支援。");
              return;
            }
            damage = 7 + partners * 4;
            feedback = "partner";
            if (hasPartnerSkill("canopy")) damage += 4;
            if (hasPartnerSkill("guard")) {
              const heal = 6;
              state.health = clamp(state.health + heal, 0, state.maxHealth);
              battle.playerHp = state.health;
              battle.defending = true;
              message = `生態夥伴支援，造成 ${damage} 傷害；台灣黑熊守護讓你回復 ${heal} 體力。`;
            } else {
              message = `生態夥伴支援，造成 ${damage} 傷害。`;
            }
          } else if (key === "4") {
            battle.defending = true;
            state.health = clamp(state.health + 3, 0, state.maxHealth);
            battle.playerHp = state.health;
            pushBattleLog("你整理背包、拉開距離，下一次受到的傷害降低。");
            triggerBattleFeedback("defend", 0);
          } else {
            return;
          }

          if (damage > 0) {
            monster.hp = Math.max(0, monster.hp - damage);
            battle.monsterHp = monster.hp;
            pushBattleLog(message);
            triggerBattleFeedback(feedback || "strike", damage);
          }
          if (monster.hp <= 0) {
            finishBattle(true, monster);
            return;
          }
          monsterBattleTurn(monster);
        }

        function monsterBattleTurn(monster) {
          const battle = state.battle;
          if (!battle) return;
          let damage = 4 + monster.stage * 4 + Math.floor(monster.absorbed / 2);
          if (battle.weakened) {
            damage = Math.ceil(damage * 0.72);
            battle.weakened = false;
          }
          if (battle.defending) {
            damage = Math.ceil(damage * 0.45);
            battle.defending = false;
          }
          if (state.completedMissions["monster-response"]) damage = Math.ceil(damage * 0.88);
          state.health = clamp(state.health - damage, 0, state.maxHealth);
          battle.playerHp = state.health;
          pushBattleLog(`垃圾怪推來混雜垃圾，造成 ${damage} 傷害。`);
          triggerBattleFeedback("enemy", damage);
          if (state.health <= 0) finishBattle(false, monster);
        }

        function finishBattle(victory, monster) {
          if (victory) {
            playBattleSound("victory");
            const drops = monster.trashHeld.length ? monster.trashHeld : ["general"];
            state.stats.monstersDefeated += 1;
            addTrashBundleToBackpack(drops, "戰鬥回收");
            addNotes(12 + monster.stage * 8 + monster.absorbed, "擊敗垃圾怪");
            adjustEco({ pollution: -monster.stage * 4, bio: 1 + monster.stage });
            state.monsters = state.monsters.filter((item) => item.uid !== monster.uid);
            state.battle = null;
            showDialogue("垃圾怪被清理", `你擊敗第 ${monster.stage} 階垃圾怪，牠吸收的垃圾已進入背包。回收場分類越準，獎勵越高。`, 4.4);
            evaluateMissions();
          } else {
            playBattleSound("defeat");
            applyBattleDefeatPenalty();
            state.health = Math.ceil(state.maxHealth * 0.45);
            monster.x += randRange(-90, 90);
            monster.y += randRange(-70, 70);
            adjustEco({ pollution: 6, bio: -2 });
            state.battle = null;
            showDialogue("體力不足", "你被垃圾怪逼退，戰鬥結束並扣除 50% 累積 EXP。牠還在路上，先恢復體力或找夥伴再戰。", 4.2);
          }
          uiDirty = true;
        }

        function startRecycleGame() {
          if (state.battle) return;
          const total = backpackTotal();
          if (!total) {
            showDialogue("回收場", "背包是空的。先在路上撿垃圾，或擊敗垃圾怪取得牠吸收的垃圾。", 3.2);
            return;
          }
          const items = expandBackpackItems(Math.min(5, total));
          state.recycleGame = {
            items,
            index: 0,
            correct: 0,
            answers: [],
          };
          state.fieldAction = null;
          showDialogue("回收分類小遊戲", "看題目，用 1-5 選正確分類。完美通過會拿到 bonus，並強化戰鬥的分類分析。", 4.2);
          uiDirty = true;
        }

        function handleRecycleInput(key) {
          const game = state.recycleGame;
          if (!game) return;
          const index = Number(key) - 1;
          const picked = recycleCategories[index];
          if (!picked) return;
          const itemType = trashDef(game.items[game.index]);
          const correct = picked.id === itemType.category;
          if (correct) game.correct += 1;
          game.answers.push({ item: itemType.id, picked: picked.id, correct });
          game.index += 1;
          showDialogue("回收分類", `${itemType.name} → ${picked.label}：${correct ? "正確" : `應該是 ${categoryDef(itemType.category).label}`}`, 1.8);
          if (game.index >= game.items.length) finishRecycleGame();
          uiDirty = true;
        }

        function finishRecycleGame() {
          const game = state.recycleGame;
          if (!game) return;
          const total = game.items.length;
          const perfect = game.correct === total;
          const baseReward = game.items.reduce((sum, typeId) => sum + trashDef(typeId).reward, 0);
          const accuracy = game.correct / total;
          const sortingBonus = state.completedMissions["first-recycle"] ? 1.1 : 1;
          const reward = Math.round((baseReward * (0.55 + accuracy * 0.45) + (perfect ? 18 + total * 2 : 0)) * sortingBonus);
          for (const typeId of game.items) removeTrashFromBackpack(typeId);
          state.recyclePoints += reward;
          state.recycleStats.played += 1;
          state.stats.recycledItems += total;
          if (perfect) state.recycleStats.perfect += 1;
          addNotes(perfect ? 16 : 8, perfect ? "完美分類" : "完成回收");
          addLog(`回收分類 ${game.correct}/${total}，獲得回收點數 +${reward}${perfect ? "（bonus）" : ""}。`);
          state.recycleGame = null;
          showDialogue("回收場結算", `${game.correct}/${total} 題正確，獲得 ${reward} 回收點數。${perfect ? "完美通過，分類分析已強化。" : "再練幾次，分類會更穩。"}`, 4.2);
          evaluateMissions();
          uiDirty = true;
        }

        function cancelRecycleGame() {
          if (!state.recycleGame) return;
          state.recycleGame = null;
          showDialogue("回收分類", "已暫停分類，背包內容保留。", 2.2);
          uiDirty = true;
        }

        function talkToNpc(npc) {
          const line = pick(npc.lines);
          showDialogue(`${npc.name}｜${npc.currentAct}`, line, 4);
        }

        function showDialogue(title, text, seconds = 3) {
          state.dialogue = { title, text, until: performance.now() + seconds * 1000 };
          dialogueEl.hidden = false;
          dialogueTitle.textContent = title;
          dialogueText.textContent = text;
        }

        function drawSprite(name, x, y, scale = 2, flip = false) {
          const img = sprites[name];
          if (!img) return;
          ctx.save();
          ctx.imageSmoothingEnabled = false;
          if (flip) {
            ctx.translate(Math.round(x + img.width * scale), Math.round(y));
            ctx.scale(-1, 1);
            ctx.drawImage(img, 0, 0, img.width * scale, img.height * scale);
          } else {
            ctx.drawImage(img, Math.round(x), Math.round(y), img.width * scale, img.height * scale);
          }
          ctx.restore();
        }

        function drawSpriteToBox(name, x, y, w, h, flip = false) {
          const img = sprites[name];
          if (!img) return false;
          ctx.save();
          ctx.imageSmoothingEnabled = false;
          if (flip) {
            ctx.translate(Math.round(x + w), Math.round(y));
            ctx.scale(-1, 1);
            ctx.drawImage(img, 0, 0, Math.round(w), Math.round(h));
          } else {
            ctx.drawImage(img, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
          }
          ctx.restore();
          return true;
        }

        function drawSpriteGrounded(name, cx, footY, flip = false) {
          const size = spriteDrawSize(name);
          return drawSpriteToBox(name, cx - size.w / 2, footY - size.h, size.w, size.h, flip);
        }

        function drawTile(tx, ty, x, y) {
          const t = terrainAt(tx, ty);
          const n = hash(tx, ty);
          const n2 = hash(tx, ty, 18);
          const colors = {
            grass: n > 0.68 ? "#85b875" : "#7dad6e",
            hub: n > 0.5 ? "#92bb76" : "#88b16c",
            path: n > 0.54 ? "#bd9a62" : "#b58f59",
            forest: n > 0.62 ? "#527f49" : "#496f3d",
            meadow: n > 0.5 ? "#95c86b" : "#8cbd62",
            wetland: n > 0.55 ? "#6f9b68" : "#638d62",
            coast: n > 0.55 ? "#d1bd80" : "#c6ad72",
            water: n > 0.5 ? "#51a3b4" : "#4795a6",
            void: "#0d1511",
          };
          ctx.fillStyle = colors[t] || colors.void;
          ctx.fillRect(x, y, TILE, TILE);

          if (t !== "water" && t !== "void") {
            ctx.fillStyle = "rgba(255, 248, 198, 0.08)";
            if (n2 > 0.54) ctx.fillRect(x, y, TILE, 2);
            ctx.fillStyle = "rgba(36, 53, 35, 0.08)";
            if (n2 < 0.28) ctx.fillRect(x, y + TILE - 2, TILE, 2);
          }

          if (t === "water") {
            ctx.fillStyle = "rgba(210, 244, 236, 0.38)";
            ctx.fillRect(x + ((tx + ty) % 3) * 7, y + 9, 15, 2);
            ctx.fillStyle = "rgba(47, 116, 128, 0.2)";
            ctx.fillRect(x + 3 + ((n * 12) | 0), y + 24, 13, 2);
          } else if (t === "path") {
            ctx.fillStyle = "rgba(97, 70, 39, 0.18)";
            ctx.fillRect(x + 4 + ((n * 15) | 0), y + 8 + ((n2 * 14) | 0), 5, 2);
            if (n > 0.86) {
              ctx.fillStyle = "rgba(237, 215, 156, 0.45)";
              ctx.fillRect(x + 19, y + 21, 4, 2);
            }
          } else if (t === "forest") {
            ctx.fillStyle = "rgba(37, 83, 45, 0.24)";
            if (n > 0.58) ctx.fillRect(x + 4, y + 22, 18, 4);
            if (n2 > 0.76) {
              ctx.fillStyle = "#5f8f4f";
              ctx.fillRect(x + 18, y + 8, 5, 2);
            }
          } else if (t === "wetland" && n > 0.5) {
            ctx.fillStyle = "#2f6a55";
            ctx.fillRect(x + 7, y + 10, 2, 15);
            ctx.fillRect(x + 17, y + 8, 2, 17);
            ctx.fillStyle = "rgba(190, 235, 210, 0.28)";
            ctx.fillRect(x + 4, y + 24, 20, 3);
          } else if ((t === "grass" || t === "meadow") && n > 0.82) {
            ctx.fillStyle = n > 0.92 ? "#f0d778" : "#5f9d55";
            ctx.fillRect(x + 8 + (n * 9) | 0, y + 10 + (n * 7) | 0, 3, 3);
          } else if (t === "coast" && n > 0.74) {
            ctx.fillStyle = n > 0.9 ? "#f1dfaa" : "#9c895f";
            ctx.fillRect(x + 8 + ((n * 15) | 0), y + 13 + ((n * 9) | 0), 4, 2);
          } else if (t === "hub" && n > 0.88) {
            ctx.fillStyle = "#6f9d55";
            ctx.fillRect(x + 6 + ((n * 10) | 0), y + 20, 9, 3);
          }
        }

        function drawTree(x, y, tall = false) {
          if (drawSpriteToBox(tall ? "treeTall" : "tree", x, tall ? y - 18 : y - 6, tall ? 54 : 46, tall ? 74 : 56)) return;
          ctx.fillStyle = "#5a3a22";
          ctx.fillRect(x + 13, y + 19, 8, tall ? 25 : 18);
          ctx.fillStyle = "#245b36";
          ctx.fillRect(x + 4, y + 12, 26, 12);
          ctx.fillStyle = "#2f7944";
          ctx.fillRect(x + 8, y + 2, 18, 14);
          ctx.fillStyle = "#3f8b55";
          ctx.fillRect(x + 12, y - 6, 12, 10);
        }

        function drawBush(x, y, seed = 0) {
          const n = hash(x | 0, y | 0, seed);
          ctx.fillStyle = "rgba(0,0,0,0.13)";
          ctx.fillRect(x + 3, y + 18, 26, 5);
          ctx.fillStyle = n > 0.5 ? "#496f2e" : "#557f36";
          ctx.fillRect(x + 3, y + 9, 10, 10);
          ctx.fillRect(x + 12, y + 4, 12, 15);
          ctx.fillRect(x + 22, y + 10, 8, 9);
          ctx.fillStyle = "#7aa858";
          ctx.fillRect(x + 13, y + 6, 6, 2);
          if (n > 0.72) {
            ctx.fillStyle = "#f0d778";
            ctx.fillRect(x + 7, y + 13, 2, 2);
            ctx.fillRect(x + 23, y + 14, 2, 2);
          }
        }

        function drawRock(x, y, wide = false) {
          ctx.fillStyle = "rgba(0,0,0,0.13)";
          ctx.fillRect(x + 2, y + 14, wide ? 29 : 18, 4);
          ctx.fillStyle = "#5b5a4d";
          ctx.fillRect(x + 4, y + 7, wide ? 24 : 15, 9);
          ctx.fillStyle = "#85877b";
          ctx.fillRect(x + 7, y + 5, wide ? 16 : 9, 5);
          ctx.fillStyle = "#b7b6a6";
          ctx.fillRect(x + 9, y + 6, 6, 2);
        }

        function drawReeds(x, y) {
          ctx.fillStyle = "rgba(0,0,0,0.12)";
          ctx.fillRect(x + 1, y + 20, 25, 4);
          ctx.fillStyle = "#2f6a55";
          for (let i = 0; i < 5; i++) {
            const sx = x + 3 + i * 5;
            ctx.fillRect(sx, y + 5 + (i % 2) * 3, 2, 17 - (i % 2) * 3);
            ctx.fillStyle = i % 2 ? "#9dc47c" : "#7aa868";
            ctx.fillRect(sx - 2, y + 10 + (i % 3), 2, 6);
            ctx.fillStyle = "#2f6a55";
          }
        }

        function drawFlowerPatch(x, y) {
          ctx.fillStyle = "#557f36";
          ctx.fillRect(x + 5, y + 13, 20, 4);
          ctx.fillStyle = "#e6c95b";
          ctx.fillRect(x + 7, y + 9, 3, 3);
          ctx.fillRect(x + 16, y + 7, 3, 3);
          ctx.fillStyle = "#fff0a8";
          ctx.fillRect(x + 22, y + 11, 2, 2);
        }

        function drawHabitatLandmarks() {
          for (let ty = 7; ty <= 150; ty += 6) {
            if (ty >= 31 && ty <= 37) continue;
            const cx = riverCenterX(ty);
            drawRock((cx - 3.7) * TILE, ty * TILE + 11, ty % 12 === 1);
            drawReeds((cx + 2.4) * TILE, ty * TILE + 5);
          }

          for (let ty = 34; ty <= 132; ty += 8) {
            const cx = eastRiverCenterX(ty);
            drawRock((cx - 3.4) * TILE, ty * TILE + 8, ty % 16 === 2);
            drawReeds((cx + 2.6) * TILE, ty * TILE + 4);
          }

          for (const spot of [
            [8, 11], [13, 10], [18, 13], [22, 18], [10, 21], [20, 22], [34, 88], [50, 96], [72, 108], [96, 86],
          ]) {
            drawFlowerPatch(spot[0] * TILE, spot[1] * TILE);
          }

          for (const spot of [
            [27, 7, true], [33, 6, false], [46, 8, true], [29, 24, false], [48, 27, true], [96, 16, true], [118, 24, false], [152, 38, true], [88, 78, false], [114, 92, true],
            [182, 14, true], [196, 20, false], [216, 28, true], [185, 48, false], [224, 56, true], [158, 96, true], [176, 108, false], [190, 122, true],
          ]) {
            drawTree(spot[0] * TILE, spot[1] * TILE, spot[2]);
          }

          for (const spot of [
            [42, 35], [47, 33], [51, 38], [44, 41], [53, 35], [92, 108], [106, 118], [128, 126], [139, 116],
          ]) {
            drawReeds(spot[0] * TILE, spot[1] * TILE);
          }

          for (const spot of [
            [68, 31, true], [75, 34, false], [67, 43, false], [73, 47, true], [78, 40, false], [198, 82, true], [224, 96, false], [178, 138, true], [220, 142, false],
          ]) {
            drawRock(spot[0] * TILE, spot[1] * TILE, spot[2]);
          }
        }

        function drawBuilding(x, y, w, h, roof, wall, label, spriteName = null) {
          if (spriteName && drawSpriteToBox(spriteName, x, y, w, h)) {
            ctx.fillStyle = "#f4eed8";
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(label, x + w / 2, y + h + 18);
            return;
          }
          ctx.fillStyle = "rgba(0,0,0,0.18)";
          ctx.fillRect(x + 8, y + h - 4, w, 10);
          ctx.fillStyle = wall;
          ctx.fillRect(x, y + 20, w, h - 20);
          ctx.fillStyle = roof;
          ctx.fillRect(x - 8, y + 10, w + 16, 18);
          ctx.fillRect(x + 10, y, w - 20, 14);
          ctx.fillStyle = "#304034";
          ctx.fillRect(x + w / 2 - 13, y + h - 28, 26, 28);
          ctx.fillStyle = "#f4eed8";
          ctx.font = "bold 12px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(label, x + w / 2, y + h + 18);
        }

        function drawBuildingEntrance(building) {
          const door = buildingDoorRect(building);
          if (dist(state.player, door) < 96) drawWorldLabel(building.facility === "recycle" ? "分類" : "進入", door.x + door.w / 2, door.y - 8);
        }

        function drawFallbackBridge(bridge) {
          ctx.fillStyle = "#5b3522";
          ctx.fillRect(bridge.x + bridge.w * 0.29, bridge.y + bridge.h * 0.36, bridge.w * 0.42, bridge.h * 0.48);
          ctx.fillStyle = "#8b6f3f";
          ctx.fillRect(bridge.x + bridge.w * 0.31, bridge.y + bridge.h * 0.39, bridge.w * 0.38, bridge.h * 0.38);
          ctx.fillStyle = "#d7bc75";
          const plankCount = 9;
          const plankStart = bridge.x + bridge.w * 0.33;
          const plankStep = (bridge.w * 0.34) / plankCount;
          for (let i = 0; i <= plankCount; i++) {
            ctx.fillRect(plankStart + i * plankStep, bridge.y + bridge.h * 0.39, 3, bridge.h * 0.38);
          }
        }

        function renderWorld() {
          const cam = state.camera;
          const startX = Math.floor(cam.x / TILE) - 1;
          const startY = Math.floor(cam.y / TILE) - 1;
          const endX = Math.ceil((cam.x + canvas.width) / TILE) + 1;
          const endY = Math.ceil((cam.y + canvas.height) / TILE) + 1;
          for (let ty = startY; ty <= endY; ty++) {
            for (let tx = startX; tx <= endX; tx++) drawTile(tx, ty, tx * TILE - cam.x, ty * TILE - cam.y);
          }

          ctx.save();
          ctx.translate(-cam.x, -cam.y);

          const decoStartX = clamp(startX - 1, 0, MAP_W - 1);
          const decoStartY = clamp(startY - 1, 0, MAP_H - 1);
          const decoEndX = clamp(endX + 1, 0, MAP_W - 1);
          const decoEndY = clamp(endY + 1, 0, MAP_H - 1);
          for (let tx = decoStartX; tx <= decoEndX; tx++) {
            for (let ty = decoStartY; ty <= decoEndY; ty++) {
              const t = terrainAt(tx, ty);
              const n = hash(tx, ty, 7);
              const x = tx * TILE + ((n * 9) | 0) - 3;
              const y = ty * TILE + 3 + ((hash(tx, ty, 12) * 5) | 0);
              if (t === "forest" && n > 0.79) {
                drawTree(x, y, n > 0.9);
              } else if (t === "forest" && n > 0.63 && n < 0.72) {
                drawBush(x + 4, y + 16, 3);
              } else if (t === "grass" && n > 0.975) {
                drawTree(x, y + 2, false);
              } else if (t === "hub" && n > 0.92) {
                drawBush(x + 2, y + 14, 4);
              } else if (t === "meadow" && n > 0.82) {
                drawFlowerPatch(x + 2, y + 15);
              } else if (t === "wetland" && n > 0.58) {
                drawReeds(x + 2, y + 7);
              } else if (t === "coast" && n > 0.84) {
                drawRock(x + 3, y + 12, n > 0.93);
              }
            }
          }
          drawHabitatLandmarks();

          const bridgeView = expandedRect(cameraWorldRect(0), TILE * 2);
          for (const bridge of bridgeVisuals()) {
            if (!rectsOverlap(bridge, bridgeView)) continue;
            if (!drawSpriteToBox("bridge", bridge.x, bridge.y, bridge.w, bridge.h)) drawFallbackBridge(bridge);
          }

          for (const building of buildingDefs) {
            drawBuilding(building.x, building.y, building.w, building.h, "#2e795d", "#dfc888", building.label, building.sprite);
            drawBuildingEntrance(building);
          }

          const actors = [
            ...state.trash.map((trash) => ({ kind: "trash", data: trash, y: trash.y + trash.h })),
            ...state.events.map((event) => ({ kind: "event", data: event, y: event.y + event.h })),
            ...state.monsters.map((monster) => ({ kind: "monster", data: monster, y: monster.y + monster.h })),
            ...state.animals.map((animal) => ({ kind: "animal", data: animal, y: animal.y + animal.h })),
            ...state.npcs.map((npc) => ({ kind: "npc", data: npc, y: npc.y + npc.h })),
            { kind: "player", data: state.player, y: state.player.y + state.player.h },
          ].sort((a, b) => a.y - b.y);

          for (const item of actors) {
            if (item.kind === "trash") drawTrashItem(item.data);
            if (item.kind === "event") drawEvent(item.data);
            if (item.kind === "monster") drawTrashMonster(item.data);
            if (item.kind === "animal") drawAnimal(item.data);
            if (item.kind === "npc") drawNpc(item.data);
            if (item.kind === "player") drawPlayer();
          }
          drawInteractionMarker();

          ctx.restore();
        }

        function drawEvent(event) {
          const def = eventDefs.find((item) => item.id === event.id);
          const pulse = 0.5 + Math.sin(performance.now() / 260 + event.pulse) * 0.18;
          ctx.fillStyle = `rgba(255, 243, 191, ${pulse})`;
          ctx.fillRect(event.x - 5, event.y - 5, event.w + 10, event.h + 10);
          drawSpriteGrounded(def.sprite, event.x + event.w / 2, event.y + event.h + 2);
          if (dist(event, state.player) < 70) drawWorldLabel(def.prompt, event.x + event.w / 2, event.y - 18);
        }

        function drawTrashItem(trash) {
          const def = trashDef(trash.type);
          const pulse = 0.45 + Math.sin(performance.now() / 240 + trash.pulse) * 0.14;
          const danger = clamp(trash.age / trash.transform, 0, 1);
          ctx.fillStyle = `rgba(255, 243, 191, ${pulse})`;
          ctx.fillRect(trash.x - 4, trash.y - 4, trash.w + 8, trash.h + 8);
          drawSpriteGrounded("trash", trash.x + trash.w / 2, trash.y + trash.h + 2);
          ctx.fillStyle = def.color;
          ctx.fillRect(trash.x + 2, trash.y - 8, Math.max(5, trash.w * (1 - danger)), 4);
          ctx.fillStyle = danger > 0.72 ? "#c44f45" : "#fff7d7";
          ctx.fillRect(trash.x + trash.w - 7, trash.y - 8, 5, 4);
          if (dist(trash, state.player) < 64) drawWorldLabel(`撿：${def.name}`, trash.x + trash.w / 2, trash.y - 20);
        }

        function drawTrashMonster(monster) {
          const sprite = `trashMonster${monster.stage}`;
          const bob = Math.sin(performance.now() / 360 + monster.pulse) * 2;
          const dangerColor = monster.stage === 3 ? "#c44f45" : monster.stage === 2 ? "#d88b3d" : "#fff3bf";
          ctx.fillStyle = monster.stage === 3 ? "rgba(196, 79, 69, 0.28)" : "rgba(255, 243, 191, 0.22)";
          ctx.fillRect(monster.x - 8, monster.y - 8, monster.w + 16, monster.h + 16);
          drawSpriteGrounded(sprite, monster.x + monster.w / 2, monster.y + monster.h + bob, state.player.x > monster.x);
          ctx.fillStyle = "#1b3025";
          ctx.fillRect(monster.x - 3, monster.y - 13, monster.w + 6, 6);
          ctx.fillStyle = dangerColor;
          ctx.fillRect(monster.x - 2, monster.y - 12, (monster.w + 4) * clamp(monster.hp / monsterMaxHp(monster.stage, monster.absorbed), 0, 1), 4);
          if (dist(monster, state.player) < 84) {
            const modeLabel = monster.mode === "chase" ? "追擊" : monster.mode === "forage" ? "找垃圾" : "警戒";
            drawWorldLabel(`第 ${monster.stage} 階垃圾怪｜${modeLabel}`, monster.x + monster.w / 2, monster.y - 28, dangerColor, "#244f3c");
          }
        }

        function animalSpriteFor(actor, def) {
          const frames = ANIMAL_ANIMATION_FRAMES[def.sprite];
          if (!frames || !actor.animMoving) return def.sprite;
          const frameIndex = Math.floor((actor.animClock || 0) * 5.4) % frames.length;
          const frame = frames[frameIndex];
          return sprites[frame] ? frame : def.sprite;
        }

        function drawAnimal(actor) {
          const def = animalDefs.find((animal) => animal.id === actor.id);
          if (!def) return;
          const moveBob = actor.animMoving ? Math.sin((actor.animClock || 0) * Math.PI * 10.8) * 1.2 : 0;
          const idleBob = actor.animMoving ? 0 : Math.sin(performance.now() / 680 + actor.x * 0.01) * 1.1;
          const sprite = animalSpriteFor(actor, def);
          const flip = actor.animFacing ? actor.animFacing === "right" : actor.target && actor.target.x > actor.x;
          drawSpriteGrounded(sprite, actor.x + actor.w / 2, actor.y + actor.h + moveBob + idleBob, flip);
          const progress = getAnimalProgress(def.id);
          const icon = progress.seen ? "!" : "?";
          if (dist(actor, state.player) < 72) drawWorldLabel(actor.observed ? "已記錄" : progress.seen ? "記錄" : "觀察", actor.x + actor.w / 2, actor.y - 18);
          if (actor.mood === "curious") drawWorldLabel(icon, actor.x + actor.w / 2 + 18, actor.y - 38, "#fff7d7", "#2e795d");
        }

        function drawNpc(npc) {
          drawSpriteGrounded(npc.sprite, npc.x + npc.w / 2, npc.y + npc.h + 2, state.player.x > npc.x);
          if (dist(npc, state.player) < 72) drawWorldLabel("聊天", npc.x + npc.w / 2, npc.y - 25);
        }

        function drawPlayer() {
          drawSpriteGrounded("player", state.player.x + state.player.w / 2, state.player.y + state.player.h + 2, state.player.facing === "right");
          ctx.fillStyle = "#fff7d7";
          ctx.font = "bold 11px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("調查員", state.player.x + state.player.w / 2, state.player.y - 32);

          ctx.fillStyle = top;
          ctx.fillRect(block.x, block.y, block.w, block.h - 14);

          ctx.fillRect(x + 6, y + h - 4, w, 9);
          ctx.fillStyle = "#513926";
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = color;

            ctx.moveTo(x, y);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
          }
          for (let row = y; row <= canvas.height; row += 32) {

        function drawWorldLabel(text, x, y, bg = "#fff7d7", fg = "#244f3c") {
          ctx.font = "bold 12px sans-serif";
          ctx.textAlign = "center";
          const w = ctx.measureText(text).width + 14;
          ctx.fillStyle = "rgba(0,0,0,0.22)";
          ctx.fillRect(x - w / 2 + 2, y - 12 + 2, w, 20);
          ctx.fillStyle = bg;
          ctx.fillRect(x - w / 2, y - 12, w, 20);
          ctx.fillStyle = fg;
          ctx.fillText(text, x, y + 2);
        }

        function interactablePoint(target) {
          if (!target) return null;
          if (target.type === "building") {
            const door = buildingDoorRect(target.ref);
            return { x: door.x + door.w / 2, y: door.y + 4, w: door.w, h: door.h };
          }
          if (target.type === "exit") {
            return { x: target.ref.x + target.ref.w / 2, y: target.ref.y + 3, w: target.ref.w, h: target.ref.h };
          }
          return {
            x: target.ref.x + (target.ref.w || 0) / 2,
            y: target.ref.y - 6,
            w: target.ref.w || 22,
            h: target.ref.h || 22,
          };
        }

        function drawInteractionMarker() {
          if (state.battle || state.recycleGame || state.fieldAction) return;
          const target = nearestInteractable();
          const point = interactablePoint(target);
          if (!point) return;
          const bob = Math.sin(performance.now() / 150) * 2;
          const y = point.y - 10 + bob;
          ctx.save();
          ctx.fillStyle = "rgba(59, 33, 24, 0.55)";
          ctx.fillRect(point.x - 7, y - 1, 14, 14);
          ctx.fillStyle = "#f7d36f";
          ctx.fillRect(point.x - 5, y - 3, 10, 10);
          ctx.fillStyle = "#fff7d7";
          ctx.fillRect(point.x - 2, y, 4, 4);
          ctx.fillStyle = "rgba(247, 211, 111, 0.24)";
          ctx.fillRect(point.x - point.w * 0.35, point.y + point.h * 0.42, point.w * 0.7, 3);
          ctx.restore();
        }

        function drawWeatherRain(count, speed, opacity, length, now) {
          ctx.strokeStyle = `rgba(225, 245, 247, ${opacity})`;
          ctx.lineWidth = 1;
          for (let i = 0; i < count; i++) {
            const x = (i * 47 + now * 0.11) % canvas.width;
            const y = (i * 79 + now * speed) % canvas.height;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 8, y + length);
            ctx.stroke();
          }
        }

        function drawWeatherClouds(alpha, now, dark = false) {
          ctx.fillStyle = dark ? `rgba(47, 57, 61, ${alpha})` : `rgba(246, 247, 226, ${alpha})`;
          for (let i = 0; i < 5; i++) {
            const x = ((i * 213 + now * 0.018) % (canvas.width + 220)) - 140;
            const y = 42 + i * 66 + Math.sin(now * 0.001 + i) * 8;
            const w = 92 + (i % 2) * 36;
            ctx.fillRect(Math.round(x), Math.round(y), w, 18);
            ctx.fillRect(Math.round(x + 18), Math.round(y - 10), 42, 12);
            ctx.fillRect(Math.round(x + 56), Math.round(y - 6), 54, 10);
          }
        }

        function drawWeatherFog(now) {
          for (let i = 0; i < 7; i++) {
            const y = 80 + i * 70;
            const x = ((now * 0.012 + i * 97) % 220) - 120;
            ctx.fillStyle = i % 2 ? "rgba(235, 239, 218, 0.16)" : "rgba(210, 224, 213, 0.18)";
            ctx.fillRect(Math.round(x), y, canvas.width + 140, 18);
            ctx.fillRect(Math.round(x + 70), y + 24, canvas.width - 20, 10);
          }
        }

        function drawSunnyGlints(now) {
          if (state.time < 420 || state.time > 1020) return;
          ctx.fillStyle = "rgba(255, 239, 160, 0.18)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "rgba(255, 248, 183, 0.48)";
          for (let i = 0; i < 16; i++) {
            const x = (i * 83 + Math.floor(now * 0.006)) % canvas.width;
            const y = 72 + ((i * 53) % (canvas.height - 140));
            ctx.fillRect(Math.round(x), y, 6, 2);
            ctx.fillRect(Math.round(x + 2), y - 2, 2, 6);
          }
        }

        function drawAtmosphere() {
          const t = state.time;
          const now = performance.now();
          if (t >= 1110 || t < 330) {
            ctx.fillStyle = "rgba(12, 28, 52, 0.42)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          } else if (t >= 960 && t < 1110) {
            ctx.fillStyle = "rgba(216, 126, 70, 0.18)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          } else if (t >= 300 && t < 460) {
            ctx.fillStyle = "rgba(215, 235, 228, 0.18)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }

          const visual = weatherDef().visual;
          if (visual === "sunny") {
            drawSunnyGlints(now);
          } else if (visual === "cloudy") {
            ctx.fillStyle = "rgba(80, 92, 84, 0.06)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawWeatherClouds(0.14, now);
          } else if (visual === "rain") {
            ctx.fillStyle = "rgba(71, 103, 116, 0.12)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawWeatherRain(90, 0.25, 0.42, 16, now);
          } else if (visual === "fog") {
            ctx.fillStyle = "rgba(214, 224, 213, 0.14)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawWeatherFog(now);
          } else if (visual === "overcast") {
            ctx.fillStyle = "rgba(49, 58, 62, 0.16)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawWeatherClouds(0.12, now, true);
          } else if (visual === "storm") {
            ctx.fillStyle = "rgba(23, 34, 45, 0.26)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawWeatherRain(150, 0.36, 0.55, 20, now);
            if (Math.floor(now / 1800) % 8 === 0 && now % 1800 < 110) {
              ctx.fillStyle = "rgba(255, 247, 185, 0.22)";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
          }
        }

        function drawMiniMap() {
          if (state.scene === "interior") return;
          const expanded = state.mapExpanded;
          const w = expanded ? Math.min(canvas.width - 144, (canvas.height - 96) * 1.5) : 168;
          const h = w / 1.5;
          const x = expanded ? (canvas.width - w) / 2 : canvas.width - w - 16;
          const y = expanded ? (canvas.height - h) / 2 : 16;
          const pad = expanded ? 9 : 5;
          const view = expanded
            ? { x: 0, y: 0, w: WORLD_W, h: WORLD_H }
            : (() => {
                const viewW = WORLD_W / 3;
                const viewH = WORLD_H / 3;
                const cx = clamp(state.player.x + state.player.w / 2, viewW / 2, WORLD_W - viewW / 2);
                const cy = clamp(state.player.y + state.player.h / 2, viewH / 2, WORLD_H - viewH / 2);
                return { x: cx - viewW / 2, y: cy - viewH / 2, w: viewW, h: viewH };
              })();
          const scaleX = w / view.w;
          const scaleY = h / view.h;
          const toMapX = (worldX) => x + (worldX - view.x) * scaleX;
          const toMapY = (worldY) => y + (worldY - view.y) * scaleY;
          ctx.fillStyle = "rgba(28, 48, 36, 0.86)";
          ctx.fillRect(x - pad, y - pad, w + pad * 2, h + pad * 2);
          ctx.strokeStyle = "#fff3bf";
          ctx.lineWidth = expanded ? 3 : 2;
          ctx.strokeRect(x - pad, y - pad, w + pad * 2, h + pad * 2);

          const mapImage = sprites.worldMap;
          if (mapImage) {
            ctx.save();
            ctx.imageSmoothingEnabled = false;
            const sx = (view.x / WORLD_W) * mapImage.width;
            const sy = (view.y / WORLD_H) * mapImage.height;
            const sw = (view.w / WORLD_W) * mapImage.width;
            const sh = (view.h / WORLD_H) * mapImage.height;
            ctx.drawImage(mapImage, sx, sy, sw, sh, x, y, w, h);
            ctx.restore();
          } else {
            const fallbackColors = {
              grass: "#78aa67",
              hub: "#82ad68",
              path: "#b58f59",
              forest: "#456d3b",
              meadow: "#8cbd62",
              wetland: "#638d62",
              coast: "#c6ad72",
              water: "#4795a6",
              void: "#0d1511",
            };
            const startX = Math.floor(view.x / TILE);
            const startY = Math.floor(view.y / TILE);
            const endX = Math.ceil((view.x + view.w) / TILE);
            const endY = Math.ceil((view.y + view.h) / TILE);
            for (let ty = startY; ty < endY; ty++) {
              for (let tx = startX; tx < endX; tx++) {
                ctx.fillStyle = fallbackColors[terrainAt(tx, ty)] || fallbackColors.void;
                ctx.fillRect(toMapX(tx * TILE), toMapY(ty * TILE), Math.ceil(TILE * scaleX), Math.ceil(TILE * scaleY));
              }
            }
          }

          ctx.save();
          ctx.beginPath();
          ctx.rect(x, y, w, h);
          ctx.clip();

          const camX = clamp(state.camera.x, view.x, view.x + view.w);
          const camY = clamp(state.camera.y, view.y, view.y + view.h);
          const camRight = clamp(state.camera.x + canvas.width, view.x, view.x + view.w);
          const camBottom = clamp(state.camera.y + canvas.height, view.y, view.y + view.h);
          const viewX = toMapX(camX);
          const viewY = toMapY(camY);
          const viewW = Math.max(0, (camRight - camX) * scaleX);
          const viewH = Math.max(0, (camBottom - camY) * scaleY);
          ctx.strokeStyle = "rgba(255, 247, 215, 0.72)";
          ctx.lineWidth = expanded ? 2 : 1;
          if (viewW > 0 && viewH > 0) ctx.strokeRect(viewX, viewY, viewW, viewH);

          const drawMapDot = (worldX, worldY, size, color) => {
            if (worldX < view.x || worldY < view.y || worldX > view.x + view.w || worldY > view.y + view.h) return;
            ctx.fillStyle = color;
            ctx.fillRect(toMapX(worldX) - size / 2, toMapY(worldY) - size / 2, size, size);
          };

          const smallDot = expanded ? 3 : 2;
          for (const trash of state.trash) drawMapDot(trash.x, trash.y, smallDot, "#fff3bf");
          for (const event of state.events) drawMapDot(event.x, event.y, smallDot, "#f8de8f");
          for (const monster of state.monsters) drawMapDot(monster.x, monster.y, expanded ? 5 : 3, "#c44f45");
          const playerX = toMapX(state.player.x + state.player.w / 2);
          const playerY = toMapY(state.player.y + state.player.h / 2);
          ctx.fillStyle = "#3b2118";
          ctx.fillRect(playerX - 4, playerY - 4, 8, 8);
          ctx.fillStyle = "#f44f45";
          ctx.fillRect(playerX - 2, playerY - 2, 4, 4);
          ctx.restore();
        }

        function drawFieldActionOverlay() {
          const action = state.fieldAction;
          if (!action) return;
          const x = 180;
          const y = canvas.height - 118;
          const w = canvas.width - 360;
          const h = 68;
          ctx.fillStyle = "rgba(26, 45, 34, 0.95)";
          ctx.fillRect(x, y, w, h);
          ctx.strokeStyle = "#fff3bf";
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, w, h);
          ctx.fillStyle = "#fff7d7";
          ctx.font = "bold 15px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText(`${action.def.prompt}${action.helper ? "｜夥伴協助中" : ""}`, x + 18, y + 24);
          ctx.font = "bold 12px sans-serif";
          ctx.fillStyle = "#d9ead2";
          ctx.fillText("游標進入亮區時按 Space/E", x + w - 182, y + 24);
          const bx = x + 18;
          const by = y + 40;
          const bw = w - 36;
          const bh = 14;
          ctx.fillStyle = "#594f39";
          ctx.fillRect(bx, by, bw, bh);
          ctx.fillStyle = "#d8a941";
          ctx.fillRect(bx + (action.target - action.window / 2) * bw, by, action.window * bw, bh);
          ctx.fillStyle = "#fff7d7";
          ctx.fillRect(bx + action.meter * bw - 3, by - 5, 6, bh + 10);
        }

        function drawBattleEffects(battle) {
          const effects = battle.effects || [];
          for (const effect of effects) {
            if (effect.age < 0) continue;
            const rate = clamp(effect.age / effect.maxLife, 0, 1);
            const alpha = (1 - rate) * 0.95;
            ctx.save();
            ctx.globalAlpha = alpha;
            if (effect.type === "text") {
              ctx.fillStyle = effect.color;
              ctx.strokeStyle = "rgba(14, 49, 74, 0.78)";
              ctx.lineWidth = 5;
              ctx.font = `bold ${effect.size || 20}px sans-serif`;
              ctx.textAlign = "center";
              ctx.strokeText(effect.text, effect.x, effect.y);
              ctx.fillText(effect.text, effect.x, effect.y);
            } else if (effect.type === "ring") {
              ctx.strokeStyle = effect.color;
              ctx.lineWidth = effect.width || 4;
              ctx.beginPath();
              ctx.ellipse(effect.x, effect.y, (effect.radius || 24) * (0.75 + rate * 0.9), (effect.radius || 24) * (0.46 + rate * 0.48), 0, 0, Math.PI * 2);
              ctx.stroke();
            } else if (effect.type === "slash") {
              ctx.strokeStyle = effect.color;
              ctx.lineWidth = Math.max(2, (effect.width || 8) * (1 - rate));
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(effect.x, effect.y);
              ctx.lineTo(effect.x2, effect.y2);
              ctx.stroke();
              ctx.strokeStyle = "rgba(255,255,255,0.84)";
              ctx.lineWidth = Math.max(1, (effect.width || 8) * 0.32 * (1 - rate));
              ctx.beginPath();
              ctx.moveTo(effect.x + 8, effect.y - 7);
              ctx.lineTo(effect.x2 - 8, effect.y2 + 7);
              ctx.stroke();
            } else {
              ctx.fillStyle = effect.color;
              const size = effect.size || 4;
              if (effect.type === "spark") {
                ctx.translate(effect.x, effect.y);
                ctx.rotate(rate * Math.PI * 2);
                ctx.fillRect(-size / 2, -size / 2, size, size);
              } else {
                ctx.fillRect(effect.x - size / 2, effect.y - size / 2, size, size);
              }
            }
            ctx.restore();
          }
        }

        function drawBattleOverlay() {
          const battle = state.battle;
          const monster = battleMonster();
          if (!battle || !monster) return;
          const enemyMax = monsterMaxHp(monster.stage, monster.absorbed);
          const drawFitted = (text, x, y, maxWidth) => {
            let line = text;
            while (ctx.measureText(line).width > maxWidth && line.length > 4) line = `${line.slice(0, -2)}...`;
            ctx.fillText(line, x, y);
          };
          const drawTechPanel = (x, y, w, h, fill = "rgba(235, 251, 255, 0.96)", stroke = "#1b5f88") => {
            ctx.fillStyle = "rgba(8, 26, 35, 0.22)";
            ctx.fillRect(x + 6, y + 7, w, h);
            ctx.fillStyle = fill;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = "rgba(255,255,255,0.32)";
            ctx.fillRect(x + 8, y + 8, w - 16, 3);
          };
          const drawHpPanel = (x, y, w, h, title, hp, maxHp, sub, align = "left") => {
            drawTechPanel(x, y, w, h);
            ctx.fillStyle = "#247bb3";
            ctx.fillRect(x, y, w, 25);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 15px sans-serif";
            ctx.textAlign = align;
            ctx.fillText(title, align === "right" ? x + w - 12 : x + 12, y + 18);
            ctx.fillStyle = "#1c5876";
            ctx.font = "bold 13px sans-serif";
            ctx.fillText(sub, align === "right" ? x + w - 12 : x + 12, y + 48);
            const rate = clamp(hp / maxHp, 0, 1);
            const bx = x + 18;
            const by = y + h - 27;
            const bw = w - 36;
            ctx.fillStyle = "#9db5b2";
            ctx.fillRect(bx, by, bw, 14);
            ctx.fillStyle = rate > 0.52 ? "#4fae62" : rate > 0.24 ? "#e1a23b" : "#cf5048";
            ctx.fillRect(bx, by, Math.max(3, bw * rate), 14);
            ctx.fillStyle = "#f5fbff";
            ctx.font = "bold 11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`${Math.ceil(hp)} / ${maxHp}`, bx + bw / 2, by + 11);
          };
          const drawPlatform = (cx, cy, w, h, top, side) => {
            ctx.fillStyle = "rgba(6, 25, 29, 0.26)";
            ctx.beginPath();
            ctx.ellipse(cx + 10, cy + 18, w * 0.52, h * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = side;
            ctx.beginPath();
            ctx.ellipse(cx, cy + 14, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = top;
            ctx.beginPath();
            ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(24, 73, 84, 0.44)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.stroke();
          };

          ctx.save();
          const shake = battle.shake || 0;
          if (shake > 0) {
            const now = performance.now();
            ctx.translate(Math.sin(now * 0.055) * shake * 9, Math.cos(now * 0.047) * shake * 6);
          }

          const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
          bg.addColorStop(0, "#72c5df");
          bg.addColorStop(0.38, "#e4f4d9");
          bg.addColorStop(0.62, "#77bd73");
          bg.addColorStop(1, "#315e45");
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = "rgba(255,255,255,0.22)";
          for (let i = 0; i < 10; i++) ctx.fillRect(i * 104 + 18, 54 + (i % 4) * 18, 58, 4);
          ctx.fillStyle = "rgba(24, 89, 100, 0.14)";
          for (let x = -40; x < canvas.width; x += 64) ctx.fillRect(x, 338, 42, 5);
          ctx.fillStyle = "rgba(22, 64, 49, 0.19)";
          ctx.fillRect(0, 334, canvas.width, 118);
          ctx.fillStyle = "rgba(11, 45, 49, 0.25)";
          ctx.fillRect(0, 450, canvas.width, 38);

          drawTechPanel(336, 22, 288, 42, "rgba(18, 61, 83, 0.88)", "#8fd3ff");
          ctx.fillStyle = "#e8f7ff";
          ctx.font = "bold 18px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("垃圾淨化戰", 480, 50);

          drawHpPanel(52, 84, 328, 84, "回收調查員", state.health, state.maxHealth, `夥伴 ${partnerCount()}｜回收 ${state.recyclePoints}`, "left");
          drawHpPanel(580, 84, 328, 84, `第 ${monster.stage} 階垃圾怪`, monster.hp, enemyMax, `吸收 ${monster.absorbed} 件垃圾`, "right");

          drawPlatform(238, 394, 282, 58, "#d9c678", "#9b7a40");
          drawPlatform(724, 342, 256, 52, "#d8cf8d", "#907b47");

          ctx.strokeStyle = "rgba(255, 244, 176, 0.72)";
          ctx.lineWidth = 3;
          ctx.strokeRect(626, 184, 196, 154);
          ctx.strokeStyle = "rgba(255, 244, 176, 0.32)";
          ctx.strokeRect(638, 196, 172, 130);

          drawSpriteToBox("player", 182, 248, 108, 150, true);
          if (state.progress.blackBear?.partnered) drawSpriteToBox("blackBear", 112, 318, 74, 74, true);

          const monsterSprite = `trashMonster${monster.stage}`;
          const monsterSize = SPRITE_DRAW_SIZES[monsterSprite] || { w: 54, h: 52 };
          const scale = monster.stage === 3 ? 2.35 : monster.stage === 2 ? 2.08 : 1.9;
          const mw = monsterSize.w * scale;
          const mh = monsterSize.h * scale;
          drawSpriteToBox(monsterSprite, 724 - mw / 2, 342 - mh + 8, mw, mh, false);
          drawBattleEffects(battle);

          if ((battle.flash || 0) > 0) {
            ctx.fillStyle = `rgba(255, 244, 178, ${0.18 * clamp(battle.flash, 0, 1)})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }

          drawTechPanel(44, 444, 872, 48, "rgba(236, 247, 255, 0.98)", "#1b5f88");
          ctx.fillStyle = "#16384e";
          ctx.font = "bold 15px sans-serif";
          ctx.textAlign = "left";
          drawFitted(battle.log[0] || "選擇技能開始行動。", 64, 474, 820);

          drawTechPanel(34, 506, 892, 112, "rgba(15, 55, 86, 0.96)", "#8fd3ff");
          ctx.fillStyle = "#e8f7ff";
          ctx.font = "bold 15px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText("技能指令", 56, 532);
          ctx.fillStyle = "rgba(143, 211, 255, 0.28)";
          ctx.fillRect(142, 521, 760, 2);

          const options = [
            { key: "1", name: "淨化打擊", meta: "工具系", desc: "穩定輸出" },
            { key: "2", name: "分類分析", meta: state.recycleStats.played ? "回收系" : "未練習", desc: "練習分類後削弱敵方" },
            { key: "3", name: "夥伴支援", meta: partnerCount() ? `${partnerCount()} 夥伴` : "未解鎖", desc: "已信任動物加入支援" },
            { key: "4", name: "防禦整理", meta: "守備", desc: "回血並降低下一擊" },

          for (let i = 0; i < options.length; i++) {
            const opt = options[i];
            const ox = 54 + (i % 2) * 438;
            const oy = 540 + Math.floor(i / 2) * 36;
            const fill = i === 0 ? "#f7d36f" : i === 1 ? "#76c6cc" : i === 2 ? "#8fd17b" : "#d9d2a5";
            ctx.fillStyle = fill;
            ctx.fillRect(ox, oy, 414, 30);
            ctx.strokeStyle = "#0e314a";
            ctx.lineWidth = 3;
            ctx.strokeRect(ox, oy, 414, 30);
            ctx.fillStyle = "#0e314a";
            ctx.fillRect(ox + 8, oy + 6, 24, 18);
            ctx.fillStyle = "#fff7d7";
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(opt.key, ox + 20, oy + 20);
            ctx.fillStyle = "#0e314a";
            ctx.font = "bold 15px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(opt.name, ox + 42, oy + 20);
            ctx.font = "bold 11px sans-serif";
            drawFitted(opt.desc, ox + 152, oy + 20, 130);
            ctx.textAlign = "right";
            ctx.font = "bold 12px sans-serif";
            ctx.fillText(opt.meta, ox + 400, oy + 20);

          ctx.restore();

        function render() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (state.battle) hudPills.hidden = true;
          if (state.scene === "interior") {
            renderInterior();
          } else {
            renderWorld();
            drawAtmosphere();
            drawMiniMap();
            drawFieldActionOverlay();
          }
          drawBattleOverlay();
          drawRecycleOverlay();
          updatePrompt();
          renderPlayerStatus();
          drawPauseOverlay();
          renderToasts();
        }

        function drawPauseOverlay() {
          if (!state.paused) return;
          ctx.save();
          ctx.fillStyle = "rgba(14, 23, 18, 0.34)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.restore();
        }

        function updatePrompt() {
          if (!state.started) {
            promptEl.hidden = true;
            return;
          }
          if (state.paused) {
            promptEl.hidden = true;
            return;
          }
          if (state.battle) {
            promptEl.hidden = true;
            return;
          }
          if (state.dialogue && !state.fieldAction && !state.recycleGame) {
            promptEl.hidden = true;
            return;
          }
          if (state.recycleGame) {
            promptEl.hidden = false;
            promptEl.textContent = "回收分類中：按 1-5 選分類，Esc 暫停";
            return;
          }
          if (state.fieldAction) {
            promptEl.hidden = true;
            return;
          }
          const target = nearestInteractable();
          if (!target) {
            promptEl.hidden = true;
            return;
          }
          promptEl.hidden = false;
          if (target.type === "animal") {
            const def = animalDefs.find((animal) => animal.id === target.ref.id);
            promptEl.textContent = `Space/E ${target.ref.observed ? "已記錄" : getAnimalProgress(def.id).seen ? "記錄" : "觀察"}：${def.name}`;
          }
          if (target.type === "event") {
            const def = eventDefs.find((event) => event.id === target.ref.id);
            promptEl.textContent = `Space/E ${def.prompt}：${def.name}`;
          }
          if (target.type === "trash") promptEl.textContent = `Space/E 撿起：${trashDef(target.ref.type).name}`;
          if (target.type === "npc") promptEl.textContent = `Space/E 對話：${target.ref.name}`;
          if (target.type === "building") {
            promptEl.textContent = target.ref.facility === "recycle" ? `Space/E 回收分類：${target.ref.label}` : `Space/E 進入：${target.ref.label}`;
          }
          if (target.type === "exit") {
            const interior = currentInteriorDef();
            promptEl.textContent = `Space/E 離開：${interior ? interior.name : "室內"}`;
          }
        }

        function renderPlayerStatus() {
          const hidden = !state.started || Boolean(state.battle) || Boolean(state.recycleGame) || Boolean(state.fieldAction);
          playerStatus.hidden = hidden;
          if (hidden) return;
          const needed = expToNextLevel(state.level);
          const isMax = state.level >= MAX_PLAYER_LEVEL;
          const expText = isMax ? "MAX" : `${state.exp}/${needed}`;
          const expRate = isMax ? 100 : clamp((state.exp / needed) * 100, 0, 100);
          playerStatus.innerHTML = `
            <div class="status-row">
              <span>Lv ${state.level}</span>
              <span>EXP ${expText}</span>
              <span>體力 ${state.health}/${state.maxHealth}</span>
            </div>
            <div class="status-xp"><i style="width:${expRate}%"></i></div>
          `;
        }

            valueEl.textContent = Math.round(value);
            barEl.style.width = `${clamp(value, 0, 100)}%`;
            barEl.style.background = invert
              ? value > 65 ? "var(--bad)" : value > 35 ? "var(--warn)" : "var(--good)"
              : value < 35 ? "var(--bad)" : value < 65 ? "var(--warn)" : "var(--good)";
          };
          setMetric(ui.forestValue, ui.forestBar, state.ecology.forest);
          setMetric(ui.waterValue, ui.waterBar, state.ecology.water);

                  <div class="status-grid">
                    <div class="status-tile">
                      <div class="status-label">知識卡</div>
                      <div class="status-value">${unlocked}/${knowledgeCards.length}</div>
                    </div>
                    <div class="status-tile">
                      <div class="status-label">分類完美</div>
                      <div class="status-value">${state.recycleStats.perfect}/${state.recycleStats.played}</div>
                    </div>
                  </div>
                  <div class="tip-list" style="margin-top: 8px;">
                    <div class="tip-row">戰鬥：1 淨化打擊、2 分類分析、3 夥伴支援、4 防禦整理</div>
                    <div class="tip-row">分類完美會提高「分類分析」威力；台灣藍鵲、台灣黑熊會強化夥伴支援。</div>
                    ${perkRows}
                  </div>
                </div>
              </details>

              <details class="drawer">
                <summary>操作提示 <span class="chip">快捷鍵</span></summary>
                <div class="drawer-body">
                  <div class="tip-list">
                    <div class="tip-row">探索：WASD/方向鍵移動，Shift 快走，Space/E 互動。</div>
                    <div class="tip-row">介面：B 切換圖鑑，M 放大/縮小地圖，Esc 取消行動或暫停分類。</div>
                  </div>
                </div>
              </details>
            `;
            return;
          }

          if (activeTab === "bag") {
            const categoryRows = trashTypes.map((type) => {
              const count = state.backpack[type.id] || 0;
              const category = categoryDef(type.category);
              const fill = clamp(count / 5, 0, 1) * 100;
              return `
                <div class="inventory-item ${count ? "" : "empty"}">
                  <div class="inventory-top">
                    <img class="item-icon" src="${assetUrl(type.icon)}" alt="" aria-hidden="true">
                    <span class="item-name">${type.name}</span>
                    <span class="item-count">${count}</span>
                  </div>
                  <div class="meter-line"><i style="width:${fill}%"></i></div>
                  <small>${category.label}｜${type.hint}</small>
                </div>
              `;
            }).join("");
            const total = backpackTotal();
            const capacityHint = total >= 5 ? "可直接去回收場，會抽最多 5 件進行分類。" : `再收集 ${5 - total} 件左右，就能玩一輪完整分類。`;
            sideBody.innerHTML = `
              <div class="hero-summary">
                <div class="hero-card">
                  <div class="hero-kicker">背包暫存</div>
                  <div class="hero-main">${total} 件</div>
                  <div class="hero-sub">${total ? backpackSummary() : "目前沒有垃圾。靠近路上垃圾按 Space/E 撿起。"}</div>
                </div>
                <div class="hero-card">
                  <div class="hero-kicker">回收場</div>
                  <div class="hero-main">${state.recyclePoints} 點</div>
                  <div class="hero-sub">${state.recycleStats.perfect}/${state.recycleStats.played} 次完美分類</div>
                </div>
              </div>

              <details class="drawer" open>
                <summary>分類內容 <span class="chip">${total} 件</span></summary>
                <div class="drawer-body">
                  <div class="inventory-grid">
                    ${categoryRows}
                  </div>
                </div>
              </details>

              <details class="drawer">
                <summary>回收規則 <span class="chip">${total >= 5 ? "可分類" : "收集中"}</span></summary>
                <div class="drawer-body">
                  <div class="focus-card ${total >= 5 ? "warn" : ""}">
                    <div class="focus-title">${total ? "下一步" : "收集開始"} <span class="chip">${total}/5</span></div>
                    <small>${total ? backpackSummary() : "在路上撿垃圾，或擊敗垃圾怪後取得牠吸收的垃圾。"} ${capacityHint}</small>
                  </div>
                  <div class="tip-list" style="margin-top: 8px;">
                    <div class="tip-row">到社區南側回收場互動，使用 1-5 選分類。</div>
                    <div class="tip-row">完美通過會拿 bonus，並強化戰鬥技能「分類分析」。</div>
                  </div>
                </div>
              </details>
            `;
            return;
          }

          if (activeTab === "codex") {
            const seen = animalDefs.filter((animal) => state.progress[animal.id]?.seen);
            const partnered = animalDefs.filter((animal) => state.progress[animal.id]?.partnered);
            const animalCards = animalDefs.map((animal) => {
              const p = state.progress[animal.id] || { trust: 0, seen: false, partnered: false };
              return `
                <div class="card animal-card">
                  <div class="animal-icon-frame">
                    <img class="animal-icon ${p.seen ? "" : "locked"}" src="${assetUrl(animal.sprite)}" alt="" aria-hidden="true">
                  </div>
                  <div class="animal-info">
                    <div class="card-title">${p.seen ? animal.name : "未發現動物"} <span class="chip">${p.partnered ? "夥伴" : animal.rarity}</span></div>
                    <small>${p.seen ? `${animal.habitat}｜信任 ${p.trust}/${animal.trustGoal}｜技能：${animal.skill}` : `線索：${animal.habitat}，環境條件達標後可能出現。`}</small>
                  </div>
                </div>
              `;
            }).join("");
            sideBody.innerHTML = `
              <div class="hero-summary">
                <div class="hero-card">
                  <div class="hero-kicker">收錄動物</div>
                  <div class="hero-main">${seen.length}/${animalDefs.length}</div>
                  <div class="hero-sub">已觀察物種</div>
                </div>
                <div class="hero-card">
                  <div class="hero-kicker">生態夥伴</div>
                  <div class="hero-main">${partnered.length}</div>
                  <div class="hero-sub">可支援戰鬥</div>
                </div>
              </div>
              <details class="drawer" open>
                <summary>角色圖鑑 <span class="chip">${seen.length}/${animalDefs.length}</span></summary>
                <div class="drawer-body">${animalCards}</div>
              </details>
              <details class="drawer">
                <summary>知識卡 <span class="chip">${Object.keys(state.unlockedCards).length}/${knowledgeCards.length}</span></summary>
                <div class="drawer-body">
                  ${knowledgeCards.map((card) => `
                    <div class="card">
                      <div class="card-title">${state.unlockedCards[card.id] ? card.id : "未解鎖知識"}</div>
                      <small>${state.unlockedCards[card.id] ? card.text : `線索：${card.id}`}</small>
                    </div>
                  `).join("")}
                </div>
              </details>
            `;
            return;
          }

          sideBody.innerHTML = `
            <div class="hero-summary">
              <div class="hero-card">
                <div class="hero-kicker">居民</div>
                <div class="hero-main">${state.npcs.length}</div>
                <div class="hero-sub">可對話角色</div>
              </div>
              <div class="hero-card">
                <div class="hero-kicker">現在地</div>
                <div class="hero-main">${currentZoneAt().name}</div>
                <div class="hero-sub">靠近居民按 Space/E</div>
              </div>
            </div>
            <details class="drawer" open>
              <summary>居民行程 <span class="chip">${state.npcs.length}</span></summary>
              <div class="drawer-body">
                ${state.npcs.map((npc) => `
                  <div class="card">
                    <div class="card-title">${npc.name} <span class="chip">${npc.role}</span></div>
                    <small>目前：${npc.currentAct}</small>
                  </div>
                `).join("")}
              </div>
            </details>
          `;
        }

        function getDailyAdvice() {
          if (state.monsters.length) return `路上有 ${state.monsters.length} 隻垃圾怪。先處理低階怪，避免牠們吸收更多垃圾。`;
          if (backpackTotal() >= 5) return "背包裡已有多件垃圾，先回社區南側回收場分類換點數。";
          if (state.trash.length >= 7) return "道路垃圾正在增加，優先巡查主路與橋邊，降低垃圾怪生成機率。";
          if (state.ecology.water < 50) return "溪流水質偏低，先去溪流廊道處理排水口、採樣點或岸邊垃圾。";
          if (state.ecology.pollution > 58) return "污染壓力偏高，社區站和海岸步道容易出現可處理事件。";
          if (isNight(state.time)) return "夜間適合觀察螢火蟲、陸蟹與路燈光害，但保持距離與低亮度。";
          if (state.ecology.forest < 62) return "森林健康還能提升，去近郊森林找外來植物、陷阱風險或動物足跡。";
          if (weatherDef().advice) return weatherDef().advice;
          return "環境狀態穩定，適合補完圖鑑、累積夥伴信任或尋找稀有動物。";
        }

        function renderLog() {
          logEl.innerHTML = state.log.map((line) => `<div>${line}</div>`).join("");
        }

        function update(dt) {
          if (!state.started) return;
          if (state.paused) {
            updateCamera();
            return;
          }
          updateBattleEffects(dt);
          if (!state.battle && !state.recycleGame) updateTime(dt);
          if (state.scene === "outdoor") {
            if (!state.battle && !state.recycleGame) {
              updateNpcs(dt);
              updateAnimals(dt);
              updateEvents(dt);
              updateTrash(dt);
              updateMonsters(dt);
              updateFieldAction(dt);
            }
          } else {
            state.fieldAction = null;
          }
          updatePlayer(dt);
          updateCamera();
          if (state.dialogue && performance.now() > state.dialogue.until) {
            state.dialogue = null;
            dialogueEl.hidden = true;
          }
          saveTimer += dt;
          if (saveTimer > 12) {
            saveTimer = 0;
            writeSave();
          }
        }

        function loop(now) {
          const dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
          lastTime = now;
          update(dt);
          render();
          updateHud();
          requestAnimationFrame(loop);
        }

        document.addEventListener("keydown", (event) => {
          const rawKey = event.key;
          const key = rawKey.toLowerCase();
          const saveShortcut = ((event.ctrlKey || event.metaKey) && key === "s") || (rawKey === "S" && !event.ctrlKey && !event.metaKey && !event.altKey);
          if (!event.repeat && saveShortcut) {
            event.preventDefault();
            saveNow();
            return;
          }
          keys.add(key);
          if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright", "1", "2", "3", "4", "5"].includes(key)) event.preventDefault();
          const onceKeys = [" ", "e", "enter", "b", "m", "escape", "p", "g", "i", "r", "x"];
          if (event.repeat && (state.battle || state.recycleGame || onceKeys.includes(key))) return;
          if (key === "p") {
            togglePause();
            return;
          }
          if (key === "x") {
            cycleSpeed();
            return;
          }
          if (state.paused) {
            if (key === "escape") {
              if (!homeConfirm.hidden) homeConfirm.hidden = true;
              else togglePause();
            }
            else if (TAB_HOTKEYS[key]) setActiveTab(TAB_HOTKEYS[key]);
            else if (key === "m") toggleMap();
            else if (key === "x") cycleSpeed();
            return;
          }
          if (state.battle) {
            if (["1", "2", "3", "4"].includes(key)) performBattleAction(key);
            return;
          }
          if (state.recycleGame) {
            if (key === "escape") cancelRecycleGame();
            else if (["1", "2", "3", "4", "5"].includes(key)) handleRecycleInput(key);
            return;
          }
          if (key === " " || key === "e") interact();
          if (key === "enter" && !state.started) resetGame();
          if (TAB_HOTKEYS[key]) setActiveTab(TAB_HOTKEYS[key]);
          if (key === "m") toggleMap();
          if (key === "escape" && state.fieldAction) {
            state.fieldAction = null;
            addLog("已取消環境行動。");
          }
        });

        document.addEventListener("keyup", (event) => {
          keys.delete(event.key.toLowerCase());
        });

        function setActiveTab(tabName) {
          activeTab = tabName;
          syncTabs();
        }

        function toggleMap() {
          state.mapExpanded = !state.mapExpanded;
          uiDirty = true;
        }

        function cycleSpeed() {
          state.speedIndex = (state.speedIndex + 1) % state.speedOptions.length;
          uiDirty = true;
        }

        function syncSettingsOverlay() {
          const volume = normalizedVolume();
          state.settings.volume = volume;
          settingsOverlay.hidden = !state.paused;
          if (!state.paused) homeConfirm.hidden = true;
          volumeSlider.value = String(Math.round(volume * 100));
          volumeValue.textContent = `${Math.round(volume * 100)}%`;
          applyAudioSettings();
        }

        function setVolumeFromSlider(value) {
          state.settings.volume = clamp(Number(value) / 100, 0, 1);
          syncSettingsOverlay();
          uiDirty = true;
        }

        function setPaused(paused) {
          if (!state.started) return;
          state.paused = paused;
          keys.clear();
          syncSettingsOverlay();
          addLog(state.paused ? "開啟設定頁面，遊戲已暫停。" : "繼續巡島。");
          uiDirty = true;
        }

        function togglePause() {
          setPaused(!state.paused);
        }

        function returnHome(saveFirst = false) {
          if (saveFirst && state.started) writeSave();
          state.started = false;
          state.paused = false;
          keys.clear();
          startOverlay.hidden = false;
          settingsOverlay.hidden = true;
          homeConfirm.hidden = true;
          promptEl.hidden = true;
          playerStatus.hidden = true;
          questHud.hidden = true;
          dialogueEl.hidden = true;
          stopBackgroundMusic();
          uiDirty = true;
        }

        function syncTabs() {
          document.querySelectorAll(".tab").forEach((tab) => {
            tab.classList.toggle("active", tab.dataset.tab === activeTab);
          });
          uiDirty = true;
        }

        document.querySelectorAll(".tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            setActiveTab(tab.dataset.tab);
          });
        });

        startBtn.addEventListener("click", resetGame);
        loadBtn.addEventListener("click", () => {
          if (!loadSave()) resetGame();
        });
        resetBtn.addEventListener("click", () => {
          localStorage.removeItem(SAVE_KEY);
          addLog("本機存檔已清除。");
          uiDirty = true;
        });
        resumeBtn.addEventListener("click", () => setPaused(false));
        homeBtn.addEventListener("click", () => {
          homeConfirm.hidden = false;
        });
        homeSaveBtn.addEventListener("click", () => returnHome(true));
        homeDiscardBtn.addEventListener("click", () => returnHome(false));
        homeCancelBtn.addEventListener("click", () => {
          homeConfirm.hidden = true;
        });
        volumeSlider.addEventListener("input", () => setVolumeFromSlider(volumeSlider.value));
        saveBtn.addEventListener("click", saveNow);
        pauseBtn.addEventListener("click", togglePause);
        mapBtn.addEventListener("click", () => {
          toggleMap();
        });
        speedBtn.addEventListener("click", () => {
          cycleSpeed();
        });

        setupSprites();
        loadSpriteImages();
        state.npcs = npcDefs.map((npc) => ({ ...npc, x: npc.schedule[0].x, y: npc.schedule[0].y, w: 24, h: 30, currentAct: npc.schedule[0].act }));
        state.progress = Object.fromEntries(animalDefs.map((animal) => [animal.id, { trust: 0, seen: false, partnered: false }]));
        syncSettingsOverlay();
        uiDirty = true;
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
