<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232e795d'/%3E%3Cpath d='M4 12V4h3v8zm5 0V6h3v6z' fill='%23fff7d7'/%3E%3C/svg%3E" />
    <title>森循島</title>
    <style>
      :root {
        --bg: #12251d;
        --panel: #f4eed8;
        --panel-2: #e5ddbd;
        --ink: #203529;
        --muted: #5e7568;
        --line: #b9c394;
        --accent: #2e795d;
        --accent-2: #d88b3d;
        --good: #4d9f62;
        --warn: #c38132;
        --bad: #c44f45;
        --shadow: rgba(8, 20, 14, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 12%, rgba(103, 163, 119, 0.22), transparent 28%),
          linear-gradient(135deg, #12251d, #1d3f32 48%, #1a2c28);
        color: var(--ink);
        font-family:
          "Noto Sans TC",
          "Microsoft JhengHei",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      button {
        font: inherit;
      }

      .app {
        --app-gap: 12px;
        --side-width: 430px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--side-width);
        gap: var(--app-gap);
        width: min(calc(100vw - 16px), calc((100vh - 16px) * 1.5 + var(--side-width) + var(--app-gap)));
        height: min(calc(100vh - 16px), calc((100vw - 16px - var(--side-width) - var(--app-gap)) * 0.6667));
        margin: 8px auto;
      }

      .stage {
        position: relative;
        overflow: hidden;
        aspect-ratio: 3 / 2;
        width: 100%;
        height: 100%;
        border-radius: 10px;
        background: #254c35;
        box-shadow: 0 22px 80px rgba(0, 0, 0, 0.35);
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        border: 4px solid #e5ddbd;
        border-radius: inherit;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #6fa466;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .hud-pill {
        position: absolute;
        left: 16px;
        top: 14px;
        display: block;
        max-width: calc(100% - 32px);
        pointer-events: none;
      }

      .pill {
        padding: 7px 10px;
        border: 2px solid rgba(255, 247, 214, 0.62);
        border-radius: 8px;
        background: rgba(25, 55, 42, 0.86);
        color: #fff5cf;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
      }

      .prompt {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        min-width: 360px;
        max-width: min(720px, calc(100% - 32px));
        padding: 10px 14px;
        border: 3px solid #fff3bf;
        border-radius: 8px;
        background: rgba(28, 48, 36, 0.94);
        color: #fff7d7;
        text-align: center;
        font-weight: 800;
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.26);
      }

      .prompt[hidden] {
        display: none;
      }

      .quest-hud {
        position: absolute;
        left: 16px;
        top: 74px;
        z-index: 4;
        width: min(330px, calc(100% - 32px));
        padding: 9px 10px;
        border: 2px solid rgba(255, 247, 214, 0.64);
        border-radius: 8px;
        background: rgba(25, 55, 42, 0.9);
        color: #fff5cf;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
        pointer-events: none;
      }

      .quest-hud[hidden] {
        display: none;
      }

      .quest-kicker {
        color: #dbe8c0;
        font-size: 10px;
        font-weight: 950;
      }

      .quest-title {
        margin-top: 2px;
        font-size: 13px;
        font-weight: 950;
        line-height: 1.22;
      }

      .quest-sub {
        margin-top: 3px;
        color: #dbe8c0;
        font-size: 10px;
        font-weight: 850;
        line-height: 1.28;
      }

      .quest-progress {
        height: 6px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(220, 207, 168, 0.46);
      }

      .quest-progress i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: #f7d36f;
      }

      .player-status {
        position: absolute;
        left: 16px;
        bottom: 16px;
        z-index: 4;
        width: 258px;
        padding: 8px 10px;
        border: 2px solid rgba(255, 247, 214, 0.68);
        border-radius: 8px;
        background: rgba(25, 55, 42, 0.9);
        color: #fff5cf;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.24);
        pointer-events: none;
      }

      .player-status[hidden] {
        display: none;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        font-weight: 950;
      }

      .status-row span {
        white-space: nowrap;
      }

      .status-xp {
        height: 7px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(220, 207, 168, 0.48);
      }

      .status-xp i {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #f7d36f;
      }

      .toast-stack {
        position: absolute;
        right: 18px;
        top: 92px;
        z-index: 8;
        display: grid;
        gap: 6px;
        width: min(300px, calc(100% - 36px));
        pointer-events: none;
      }

      .toast-stack[hidden] {
        display: none;
      }

      .toast {
        padding: 8px 10px;
        border: 2px solid rgba(255, 247, 214, 0.68);
        border-left-width: 5px;
        border-radius: 8px;
        background: rgba(28, 48, 36, 0.94);
        color: #fff7d7;
        font-size: 12px;
        font-weight: 900;
        line-height: 1.3;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.26);
      }

      .toast.good {
        border-left-color: var(--good);
      }

      .toast.warn {
        border-left-color: var(--warn);
      }

      .toast.bad {
        border-left-color: var(--bad);
      }

      .start {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(120, 180, 155, 0.35), rgba(27, 57, 44, 0.22)),
          radial-gradient(circle at 44% 36%, rgba(255, 249, 213, 0.8), transparent 23%);
        backdrop-filter: blur(1px);
      }

      .start[hidden] {
        display: none;
      }

      .start-card {
        width: min(720px, calc(100% - 48px));
        padding: 34px 38px 30px;
        border: 4px solid #294b39;
        border-radius: 10px;
        background: rgba(244, 238, 216, 0.96);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 18px;
      }

      .brand-mark {
        width: 86px;
        height: 86px;
        border: 4px solid #294b39;
        border-radius: 8px;
        background: #74ad68;
        image-rendering: pixelated;
        position: relative;
        box-shadow: inset 0 -16px 0 rgba(35, 79, 54, 0.22);
      }

      .brand-mark::before {
        content: "";
        position: absolute;
        left: 16px;
        top: 18px;
        width: 14px;
        height: 48px;
        background: #5a3a22;
        box-shadow:
          20px -8px 0 #2f6f44,
          4px -8px 0 #3f8b55,
          32px 4px 0 #276343,
          10px 12px 0 #8ec46f;
      }

      .start h1 {
        margin: 0;
        color: #1f4b38;
        font-size: 62px;
        line-height: 1;
        letter-spacing: 0;
      }

      .start .subtitle {
        margin: 6px 0 0;
        color: #4f705f;
        font-size: 20px;
        font-weight: 800;
      }

      .start p {
        margin: 16px 0 24px;
        color: #395847;
        font-size: 17px;
        line-height: 1.8;
      }

      .start-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .settings-overlay {
        position: absolute;
        inset: 0;
        z-index: 12;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(10, 22, 17, 0.52);
        backdrop-filter: blur(2px);
      }

      .settings-overlay[hidden] {
        display: none;
      }

      .settings-card {
        width: min(430px, 100%);
        padding: 18px;
        border: 4px solid #244f3c;
        border-radius: 8px;
        background: #efe5bd;
        color: #244f3c;
        box-shadow: 0 14px 0 rgba(15, 37, 28, 0.28);
      }

      .settings-card h2 {
        margin: 0;
        font-size: 26px;
        line-height: 1.1;
      }

      .settings-card p {
        margin: 8px 0 16px;
        color: #5e7568;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.6;
      }

      .setting-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 12px;
        border: 2px solid rgba(36, 79, 60, 0.24);
        border-radius: 7px;
        background: #fff7dc;
      }

      .setting-row label,
      .setting-row output {
        font-weight: 950;
      }

      .setting-row input {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: #2e795d;
      }

      .settings-actions,
      .home-confirm-actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .home-confirm {
        margin-top: 14px;
        padding: 12px;
        border: 2px solid rgba(207, 80, 72, 0.42);
        border-radius: 7px;
        background: #fff7dc;
      }

      .home-confirm[hidden] {
        display: none;
      }

      .home-confirm strong {
        display: block;
        color: #9b433b;
        font-size: 14px;
      }

      .primary,
      .secondary {
        min-height: 44px;
        padding: 0 18px;
        border: 3px solid #294b39;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 900;
      }

      .primary {
        background: #2e795d;
        color: #fff8d8;
      }

      .secondary {
        background: #efe5bd;
        color: #294b39;
      }

      .side {
        display: flex;
        min-height: 0;
        flex-direction: column;
        gap: 7px;
      }

      .hud-strip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
        white-space: normal;
      }

      .weather-icon {
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.22));
      }

      .hud-copy {
        display: inline-flex;
        min-width: 0;
        flex-direction: column;
        gap: 2px;
        line-height: 1.1;
      }

      .hud-main {
        white-space: nowrap;
      }

      .hud-weather-note {
        color: #dbe8c0;
        font-size: 10px;
        font-weight: 900;
        opacity: 0.92;
      }

      .panel {
        border: 3px solid var(--line);
        border-radius: 10px;
        background: rgba(244, 238, 216, 0.97);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
      }

      .panel.header {
        display: none;
        padding: 8px 11px;
      }

      .header h2 {
        margin: 0;
        color: #1f4b38;
        font-size: 21px;
        line-height: 1.1;
      }

      .header .tag {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        line-height: 1.25;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        padding: 7px;
      }

      .metric {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 34px;
        align-items: center;
        gap: 5px 7px;
        padding: 4px 7px;
        border: 2px solid rgba(105, 126, 86, 0.38);
        border-radius: 8px;
        background: #fff7dc;
      }

      .metric-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .metric-value {
        margin-top: 0;
        text-align: right;
        font-size: 17px;
        font-weight: 950;
        color: #244f3c;
      }

      .bar {
        position: relative;
        grid-column: 1 / -1;
        height: 7px;
        margin-top: 0;
        overflow: hidden;
        border-radius: 999px;
        background: #dccfa8;
      }

      .bar > i {
        display: block;
        width: 50%;
        height: 100%;
        border-radius: inherit;
        background: var(--good);
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 7px;
      }

      .tab {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 32px;
        padding: 0 7px;
        border: 2px solid rgba(68, 92, 66, 0.42);
        border-radius: 7px;
        background: #efe5bd;
        color: #385441;
        cursor: pointer;
        font-size: 13px;
        font-weight: 900;
        text-align: center;
      }

      .tab.active {
        border-color: #244f3c;
        background: #2e795d;
        color: #fff8d8;
      }

      .scroll {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .scroll-body {
        height: 100%;
        padding: 7px;
        overflow: auto;
      }

      .card {
        padding: 7px;
        border: 1px solid rgba(105, 126, 86, 0.34);
        border-radius: 6px;
        background: #fff7dc;
      }

      .card + .card {
        margin-top: 5px;
      }

      .card-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: #244f3c;
        font-size: 13px;
        font-weight: 950;
      }

      .card small {
        display: block;
        margin-top: 4px;
        color: #5e7568;
        font-size: 11px;
        line-height: 1.4;
      }

      .section-title {
        margin: 10px 2px 7px;
        color: #244f3c;
        font-size: 12px;
        font-weight: 950;
        letter-spacing: 0;
      }

      .section-title:first-child {
        margin-top: 0;
      }

      .hero-summary {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 6px;
        margin-bottom: 6px;
      }

      .hero-card {
        min-width: 0;
        padding: 7px 8px;
        border: 1px solid rgba(46, 121, 93, 0.35);
        border-radius: 6px;
        background: linear-gradient(135deg, #fff8df, #efe4bd);
      }

      .hero-kicker {
        color: var(--muted);
        font-size: 10px;
        font-weight: 950;
      }

      .hero-main {
        margin-top: 3px;
        color: #1f4b38;
        font-size: 18px;
        font-weight: 950;
        line-height: 1.18;
        overflow-wrap: anywhere;
      }

      .hero-sub {
        margin-top: 3px;
        color: #5e7568;
        font-size: 11px;
        font-weight: 800;
        line-height: 1.3;
      }

      .drawer {
        overflow: hidden;
        border: 1px solid rgba(105, 126, 86, 0.34);
        border-radius: 6px;
        background: #fff7dc;
      }

      .drawer + .drawer {
        margin-top: 6px;
      }

      .drawer summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 31px;
        padding: 0 8px;
        cursor: pointer;
        color: #244f3c;
        font-size: 13px;
        font-weight: 950;
        list-style: none;
        background: rgba(219, 232, 192, 0.58);
      }

      .drawer summary::-webkit-details-marker {
        display: none;
      }

      .drawer summary::after {
        content: "+";
        display: inline-grid;
        place-items: center;
        width: 17px;
        height: 17px;
        border-radius: 999px;
        background: #2e795d;
        color: #fff7d7;
        font-size: 13px;
        font-weight: 950;
      }

      .drawer[open] summary::after {
        content: "-";
      }

      .drawer-body {
        padding: 7px;
      }

      .status-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .status-tile {
        min-width: 0;
        padding: 6px 7px;
        border: 1px solid rgba(105, 126, 86, 0.34);
        border-radius: 6px;
        background: #fff7dc;
      }

      .status-label {
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
      }

      .status-value {
        margin-top: 2px;
        color: #244f3c;
        font-size: 16px;
        font-weight: 950;
        overflow-wrap: anywhere;
      }

      .focus-card {
        padding: 8px;
        border: 1px solid rgba(46, 121, 93, 0.35);
        border-left: 5px solid var(--accent);
        border-radius: 6px;
        background: #fff7dc;
      }

      .focus-card.warn {
        border-left-color: var(--warn);
      }

      .focus-card.bad {
        border-left-color: var(--bad);
      }

      .focus-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: #244f3c;
        font-size: 13px;
        font-weight: 950;
      }

      .focus-card small {
        display: block;
        margin-top: 4px;
        color: #5e7568;
        font-size: 11px;
        line-height: 1.4;
      }

      .inventory-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .inventory-item {
        min-width: 0;
        min-height: 44px;
        padding: 6px;
        border: 1px solid rgba(105, 126, 86, 0.34);
        border-radius: 6px;
        background: #fff7dc;
      }

      .inventory-item.empty {
        opacity: 0.62;
      }

      .inventory-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .item-icon,
      .animal-icon {
        flex: 0 0 auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .item-icon {
        width: 32px;
        height: 32px;
        padding: 2px;
        border: 1px solid rgba(36, 79, 60, 0.22);
        border-radius: 6px;
        background: rgba(255, 248, 218, 0.72);
      }

      .animal-card {
        display: grid;
        grid-template-columns: 46px 1fr;
        gap: 8px;
        align-items: center;
      }

      .animal-icon-frame {
        display: grid;
        place-items: center;
        width: 46px;
        height: 42px;
        flex: 0 0 auto;
        overflow: hidden;
        border: 1px solid rgba(36, 79, 60, 0.22);
        border-radius: 6px;
        background: rgba(219, 232, 192, 0.58);
      }

      .animal-icon {
        max-width: 42px;
        max-height: 38px;
        object-fit: contain;
      }

      .animal-icon.locked {
        opacity: 0.38;
        filter: grayscale(1) brightness(0.72);
      }

      .animal-info {
        min-width: 0;
      }

      .item-name {
        flex: 1;
        min-width: 0;
        color: #244f3c;
        font-size: 12px;
        font-weight: 950;
      }

      .item-count {
        min-width: 24px;
        color: #244f3c;
        text-align: right;
        font-size: 18px;
        font-weight: 950;
      }

      .inventory-item small {
        display: block;
        margin-top: 3px;
        color: #5e7568;
        font-size: 11px;
        line-height: 1.3;
      }

      .meter-line {
        height: 6px;
        margin-top: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: #dccfa8;
      }

      .meter-line > i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
      }

      .tip-list {
        display: grid;
        gap: 5px;
      }

      .tip-row {
        padding: 7px 8px;
        border: 1px solid rgba(105, 126, 86, 0.24);
        border-radius: 6px;
        background: rgba(255, 247, 220, 0.75);
        color: #385441;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.35;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 19px;
        padding: 0 6px;
        border-radius: 999px;
        background: #dbe8c0;
        color: #355b43;
        font-size: 10px;
        font-weight: 900;
        white-space: nowrap;
      }

      .weather-chip {
        gap: 4px;
        padding-left: 3px;
      }

      .weather-chip .weather-icon {
        width: 16px;
        height: 16px;
        filter: none;
      }

      .quick {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 7px;
      }

      .quick button {
        min-height: 32px;
        padding: 0 4px;
        border: 2px solid rgba(68, 92, 66, 0.45);
        border-radius: 7px;
        background: #fff7dc;
        color: #294b39;
        cursor: pointer;
        font-size: 13px;
        font-weight: 950;
        line-height: 1;

        height: 20px;

        border-radius: 999px;
        background: #2e795d;
        color: #fff7d7;
        font-size: 15px;
        font-weight: 950;

        content: "-";
      }

        max-height: 118px;
        padding: 0 10px 10px;
        overflow: auto;
        color: #385441;
        font-size: 13px;
        line-height: 1.55;
      }

        padding-top: 7px;

      }

      .log-drawer {
        overflow: hidden;
      }

        min-height: 34px;
        padding: 0 12px;
        cursor: pointer;
        color: #244f3c;
        font-weight: 950;
        list-style: none;
      }

      .log-drawer summary::-webkit-details-marker {
        display: none;
      }

      .dialogue {
        position: absolute;
        right: 16px;
        bottom: 18px;
        width: min(430px, calc(100% - 32px));
        padding: 14px 16px;
        border: 3px solid #fff3bf;
        border-radius: 8px;
        background: rgba(28, 48, 36, 0.95);
        color: #fff7d7;
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3);

      }

      .dialogue b {
        display: block;
        margin-bottom: 6px;
        color: #f8de8f;
      }

      .dialogue span {
        display: block;
        line-height: 1.6;
      }

          overflow: auto;
        }

        .app {

          width: min(960px, calc(100vw - 16px));

        }

        function normalizePlayerLevel() {
          state.level = clamp(Math.floor(Number(state.level)) || 1, 1, MAX_PLAYER_LEVEL);
          state.exp = Math.max(0, Math.floor(Number(state.exp)) || 0);
          while (state.level < MAX_PLAYER_LEVEL && state.exp >= expToNextLevel(state.level)) {
            state.exp -= expToNextLevel(state.level);
            state.level += 1;
          }
          if (state.level >= MAX_PLAYER_LEVEL) state.exp = 0;
          state.maxHealth = maxHealthForLevel(state.level);
          state.health = clamp(Number(state.health) || state.maxHealth, 1, state.maxHealth);

        function addExperience(amount, label = "經驗") {
          const gained = Math.max(0, Math.round(amount));

          state.exp += gained;
          let leveled = false;
          while (state.level < MAX_PLAYER_LEVEL && state.exp >= expToNextLevel(state.level)) {
            state.exp -= expToNextLevel(state.level);
            const previousMax = state.maxHealth;
            state.level += 1;
            state.maxHealth = maxHealthForLevel(state.level);
            state.health = clamp(state.health + (state.maxHealth - previousMax), 1, state.maxHealth);
            leveled = true;
          }
          if (state.level >= MAX_PLAYER_LEVEL) state.exp = 0;
          if (leveled) addLog(`等級提升至 Lv ${state.level}，最大體力提高到 ${state.maxHealth}。`);
          addToast(`${label}：EXP +${gained}${leveled ? `｜Lv ${state.level}` : ""}`, leveled ? "good" : "warn");
          uiDirty = true;
        }

          const safeLevel = clamp(Math.floor(level) || 1, 1, MAX_PLAYER_LEVEL);

          return total;

            if (reward.points) state.recyclePoints += reward.points;
            if (reward.exp) addExperience(reward.exp, "任務完成");
            applyMissionPerk(mission);
            addLog(`任務完成：${mission.title}。獎勵：EXP +${reward.exp || 0}、回收點數 +${reward.points || 0}${mission.perk ? `、${mission.perk}` : ""}。`);
            addToast(`任務完成：${mission.title}`, "good", 4.2);
            uiDirty = true;
          }
        }

        function applyMissionPerk(mission) {
          if (!mission) return;
          if (mission.id === "first-cleanup") {
            state.player.speed = Math.max(state.player.speed, 152);
          }
          if (mission.id === "island-steward") {
            showDialogue("森循島守護者", "你已完成一輪穩定的巡查循環：探索、任務、收集、回收、升級與守護。接下來可以挑戰完美分類、完整圖鑑與稀有夥伴。", 6);
          }
          if (mission.perk) addToast(`解鎖加成：${mission.perk}`, "warn", 4.2);
        }

        function syncMissionPerks() {
          if (state.completedMissions["first-cleanup"]) state.player.speed = Math.max(state.player.speed, 152);
        }

        function unlockCard(id) {
          if (!id || state.unlockedCards[id]) return false;
          state.unlockedCards[id] = true;
          addLog(`解鎖知識卡：${id}`);
          return true;
        }

        function addNotes(amount, label = "自然筆記") {
          state.notes += amount;
          addLog(`${label} +${amount}`);
          addExperience(amount, label);
        }

        function adjustEco(delta, multiplier = 1) {
          for (const key of Object.keys(delta)) {
            state.ecology[key] = clamp(state.ecology[key] + delta[key] * multiplier, 0, 100);
          }
          uiDirty = true;
        }

          return animalDefs.some((animal) => state.progress[animal.id]?.partnered && animal.skillTag === eventDef.skillTag);
        }

        function loadSpriteImages() {
          let pending = Object.keys(ASSET_FILES).length;
          let loaded = 0;
          let failed = 0;
          const finish = () => {
            pending -= 1;
            if (pending > 0) return;
            console.info(`pixel assets loaded: ${loaded}, fallback: ${failed}`);
            if (state.started) addLog(`像素圖片載入完成：${loaded} 個物件。`);
            uiDirty = true;
          };

          for (const [name, file] of Object.entries(ASSET_FILES)) {
            const img = new Image();
            img.onload = () => {
              sprites[name] = img;
              loaded += 1;
              uiDirty = true;
              finish();
            };
            img.onerror = () => {
              failed += 1;
              console.warn(`pixel asset failed: ${file}`);
              finish();
            };
            img.src = `${ASSET_BASE}${file}`;
          }
        }

        function resetGame(options = {}) {
          const { persist = true } = options;
          const preservedSettings = { ...state.settings };
          state.started = true;
          state.paused = false;
          state.settings = preservedSettings;
          state.showMap = true;
          state.mapExpanded = false;
          state.speedIndex = 0;
          state.day = 1;
          state.time = 7 * 60;
          state.weather = "晴朗";
          state.notes = 0;
          state.recyclePoints = 0;
          state.level = 1;
          state.exp = 0;
          state.maxHealth = maxHealthForLevel(state.level);
          state.health = state.maxHealth;
          state.scene = "outdoor";
          state.interior = null;
          state.outdoorPlayer = null;
          state.player = { x: 10 * TILE, y: 34 * TILE, w: 24, h: 30, speed: 138, dir: "down", facing: "left" };
          state.camera = { x: 0, y: 0 };
          state.ecology = { forest: 44, water: 36, pollution: 72, bio: 24 };
          state.animals = [];
          state.animalSpawnTimer = 0;
          state.localAnimalSpawnTimer = 0;
          state.events = [];
          state.trash = [];
          state.trashSpawnTimer = 0;
          state.monsters = [];
          state.npcs = npcDefs.map((npc) => ({ ...npc, x: npc.schedule[0].x, y: npc.schedule[0].y, w: 24, h: 30, currentAct: npc.schedule[0].act }));
          state.backpack = Object.fromEntries(trashTypes.map((type) => [type.id, 0]));
          state.recycleStats = { played: 0, perfect: 0 };
          state.stats = defaultStats();
          state.completedMissions = {};
          state.progress = Object.fromEntries(animalDefs.map((animal) => [animal.id, { trust: 0, seen: false, partnered: false }]));
          state.unlockedCards = {};
          state.log = [];
          state.toasts = [];
          state.dialogue = null;
          state.fieldAction = null;
          state.battle = null;
          state.recycleGame = null;
          addLog("抵達森循島：撿垃圾、阻止垃圾怪、把資源帶回回收場。");
          addLog("任務路線已開啟：先清出第一條安全步道。");
          addLog("WASD 移動，E/空白鍵互動；戰鬥和分類時用 1-5 選項。");
          ensurePlayerOnWalkable("初始位置");
          updateCamera();
          for (let i = 0; i < ANIMAL_START_COUNT; i++) spawnAnimal({ offscreen: true });
          scheduleNextAnimalSpawn(ANIMAL_SPAWN_DELAY);
          scheduleLocalAnimalSpawn({ min: 1, max: 2.5 });
          for (let i = 0; i < 7; i++) spawnEvent();
          for (let i = 0; i < TRASH_START_COUNT; i++) spawnRoadTrash();
          scheduleNextTrashSpawn(TRASH_START_SPAWN_DELAY);
          startOverlay.hidden = true;
          syncSettingsOverlay();
          startBackgroundMusic();
          uiDirty = true;
          if (persist) saveNow();
        }

          const savedPlayer = state.scene === "interior" && state.outdoorPlayer ? state.outdoorPlayer : state.player;
          return {
            started: state.started,
            settings: state.settings,
            showMap: state.showMap,
            mapExpanded: state.mapExpanded,
            speedIndex: state.speedIndex,
            day: state.day,
            time: state.time,
            weather: state.weather,
            notes: state.notes,
            recyclePoints: state.recyclePoints,
            level: state.level,
            exp: state.exp,
            health: state.health,
            player: savedPlayer,
            ecology: state.ecology,
            backpack: state.backpack,
            recycleStats: state.recycleStats,
            stats: state.stats,
            completedMissions: state.completedMissions,
            trash: state.trash,
            trashSpawnTimer: state.trashSpawnTimer,
            monsters: state.monsters,
            progress: state.progress,
            unlockedCards: state.unlockedCards,
            log: state.log,
          };
        }

        function writeSave() {
          localStorage.setItem(SAVE_KEY, JSON.stringify(createSaveData()));
        }

        function saveNow() {
          if (!state.started) return false;
          addLog("已儲存目前巡島紀錄。");
          writeSave();
          uiDirty = true;
          return true;
        }

        function loadSave() {
          const raw = localStorage.getItem(SAVE_KEY);
          if (!raw) {
            addLog("沒有找到自動存檔。");
            return false;
          }
          try {
            const data = JSON.parse(raw);
            resetGame({ persist: false });
            state.settings = { ...state.settings, ...(data.settings || {}) };
            const loadedVolume = Number(state.settings.volume);
            state.settings.volume = Number.isFinite(loadedVolume) ? clamp(loadedVolume, 0, 1) : 0.7;
            state.showMap = true;
            state.mapExpanded = typeof data.mapExpanded === "boolean" ? data.mapExpanded : false;
            state.speedIndex = clamp(data.speedIndex || 0, 0, state.speedOptions.length - 1);
            state.day = Math.max(1, data.day || 1);
            state.time = Number(data.time) || 7 * 60;
            state.weather = WEATHER.includes(data.weather) ? data.weather : "晴朗";
            state.notes = Math.max(0, data.notes || 0);
            state.recyclePoints = Math.max(0, data.recyclePoints || 0);
            state.level = clamp(Math.floor(Number(data.level)) || 1, 1, MAX_PLAYER_LEVEL);
            state.exp = Math.max(0, Math.floor(Number(data.exp)) || 0);
            normalizePlayerLevel();
            state.health = clamp(Number(data.health) || state.maxHealth, 1, state.maxHealth);
            const savedX = Number(data.player?.x);
            const savedY = Number(data.player?.y);
            const savedSpeed = Number(data.player?.speed);
            state.player = {
              ...state.player,
              x: Number.isFinite(savedX) ? savedX : state.player.x,
              y: Number.isFinite(savedY) ? savedY : state.player.y,
              speed: Number.isFinite(savedSpeed) && savedSpeed > 0 ? savedSpeed : state.player.speed,
              dir: data.player?.dir || state.player.dir,
              facing: data.player?.facing === "right" || data.player?.facing === "left" ? data.player.facing : state.player.facing,
            };
            ensurePlayerOnWalkable("讀檔位置");
            state.ecology = { ...state.ecology, ...(data.ecology || {}) };
            state.backpack = { ...Object.fromEntries(trashTypes.map((type) => [type.id, 0])), ...(data.backpack || {}) };
            state.recycleStats = { ...state.recycleStats, ...(data.recycleStats || {}) };
            state.stats = { ...defaultStats(), ...(data.stats || {}) };
            state.completedMissions = data.completedMissions || {};
            syncMissionPerks();
            state.trash = Array.isArray(data.trash)
              ? data.trash.map(normalizeTrash).filter(Boolean).slice(0, TRASH_MAX_ACTIVE)
              : state.trash;
            state.trashSpawnTimer = Number.isFinite(data.trashSpawnTimer)
              ? clamp(data.trashSpawnTimer, TRASH_RETRY_DELAY.min, TRASH_SPAWN_DELAY.max)
              : randRange(TRASH_START_SPAWN_DELAY.min, TRASH_START_SPAWN_DELAY.max);
            state.monsters = Array.isArray(data.monsters) ? data.monsters : state.monsters;
            state.progress = { ...state.progress, ...(data.progress || {}) };
            state.unlockedCards = data.unlockedCards || {};
            state.log = Array.isArray(data.log) ? data.log.slice(0, 8) : state.log;
            startOverlay.hidden = true;
            syncSettingsOverlay();
            startBackgroundMusic();
            addLog("已讀取自動存檔。");
            evaluateMissions();
            writeSave();
            uiDirty = true;
            return true;
          } catch (err) {
            console.warn(err);
            addLog("存檔讀取失敗，已保留新遊戲狀態。");
            return false;
          }
        }

        function riverCenterX(tileY) {
          return 57 + Math.sin(tileY * 0.32) * 3.4 + Math.sin(tileY * 0.09) * 1.2;
        }

        function eastRiverCenterX(tileY) {
          return 156 + Math.sin(tileY * 0.22) * 4.8 + Math.sin(tileY * 0.07) * 2.2;
        }

        function isBridgeTile(tx, ty) {
          const west = Math.abs(tx - riverCenterX(ty)) <= 4.8 && ((ty >= 33 && ty <= 35) || (ty >= 111 && ty <= 113));
          const east = Math.abs(tx - eastRiverCenterX(ty)) <= 5.2 && ((ty >= 60 && ty <= 62) || (ty >= 111 && ty <= 113));
          return west || east;
        }

        function bridgeVisuals() {
          const bridgeH = 5.45 * TILE;
          const bridgeW = bridgeH * (286 / 96) * 1.12 + 0.5 * TILE;
          const westOffset = 1.65 * TILE;
          const eastOffset = 1.15 * TILE;
          const yOffset = 0.13 * TILE;
          return [
            { x: riverCenterX(34) * TILE - bridgeW / 2 + westOffset, y: 31.75 * TILE - yOffset, w: bridgeW, h: bridgeH },
            { x: riverCenterX(112) * TILE - bridgeW / 2 + westOffset, y: 109.75 * TILE - yOffset, w: bridgeW, h: bridgeH },
            { x: eastRiverCenterX(61) * TILE - bridgeW / 2 + eastOffset, y: 58.75 * TILE - yOffset, w: bridgeW, h: bridgeH },
            { x: eastRiverCenterX(112) * TILE - bridgeW / 2 + eastOffset, y: 109.75 * TILE - yOffset, w: bridgeW, h: bridgeH },
          ];
        }

        function isWetlandPool(tx, ty) {
          const dx = (tx - 48.5) / 5.6;
          const dy = (ty - 37.5) / 3.8;
          const smallDx = (tx - 53) / 2.4;
          const smallDy = (ty - 41.5) / 2.2;
          const southDx = (tx - 108) / 17;
          const southDy = (ty - 112) / 10;
          const reedDx = (tx - 132) / 10;
          const reedDy = (ty - 129) / 6;
          return dx * dx + dy * dy < 1 || smallDx * smallDx + smallDy * smallDy < 1 || southDx * southDx + southDy * southDy < 1 || reedDx * reedDx + reedDy * reedDy < 1;
        }

        function isPathTile(tx, ty) {
          const eastWest = ty >= 33 && ty <= 35 && tx >= 5 && tx <= 150;
          const hubVertical = tx >= 11 && tx <= 13 && ty >= 12 && ty <= 43;
          const meadowLoop = ty >= 15 && ty <= 17 && tx >= 11 && tx <= 47;
          const forestFork = tx >= 35 && tx <= 37 && ty >= 10 && ty <= 88;
          const ridgeTrail = tx >= 100 && tx <= 102 && ty >= 13 && ty <= 84;
          const eastValley = tx >= 145 && tx <= 147 && ty >= 36 && ty <= 118;
          const southRoad = ty >= 111 && ty <= 113 && tx >= 18 && tx <= 196;
          const wetlandLoop = ty >= 126 && ty <= 128 && tx >= 83 && tx <= 147;
          const coastSpine = tx >= 211 && tx <= 213 && ty >= 74 && ty <= 148;
          const coastShore = ty >= 139 && ty <= 141 && tx >= 166 && tx <= 236;
          const eastRoad = ty >= 60 && ty <= 62 && tx >= 94 && tx <= 216;
          return eastWest || hubVertical || meadowLoop || forestFork || ridgeTrail || eastValley || southRoad || wetlandLoop || coastSpine || coastShore || eastRoad || isBridgeTile(tx, ty);
        }

        function terrainAt(tx, ty) {
          if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return "void";
          const westRiver = ty >= 3 && ty <= 154 && Math.abs(tx - riverCenterX(ty)) <= 2.35;
          const eastRiver = ty >= 28 && ty <= 134 && Math.abs(tx - eastRiverCenterX(ty)) <= 2.65;
          const shoreWater = (tx >= 238 && ty >= 70 + Math.sin(ty * 0.42) * 5) || (ty >= 157 + Math.sin(tx * 0.13) * 3);
          const eastBay = ((tx - 225) / 13) ** 2 + ((ty - 112) / 24) ** 2 < 1;
          if (isPathTile(tx, ty) && ((!westRiver && !eastRiver) || isBridgeTile(tx, ty))) return "path";
          if (((westRiver || eastRiver) && !isBridgeTile(tx, ty)) || isWetlandPool(tx, ty) || shoreWater || eastBay) return "water";
          if ((tx >= 196 && ty >= 68) || (tx >= 156 && ty >= 132) || ty >= 146) return "coast";
          if ((tx >= 41 && tx <= 70 && ty >= 31 && ty <= 55) || (tx >= 78 && tx <= 148 && ty >= 88 && ty <= 140)) return "wetland";
          if (
            (tx >= 24 && tx <= 95 && ty >= 4 && ty <= 44) ||
            (tx >= 86 && tx <= 170 && ty >= 8 && ty <= 82) ||
            (tx >= 172 && tx <= 232 && ty >= 10 && ty <= 66) ||
            (tx >= 32 && tx <= 120 && ty >= 72 && ty <= 112) ||
            (tx >= 150 && tx <= 194 && ty >= 88 && ty <= 130)
          ) return "forest";
          if ((tx >= 6 && tx <= 82 && ty >= 8 && ty <= 78) || (tx >= 20 && tx <= 108 && ty >= 78 && ty <= 124)) return "meadow";
          if (tx >= 2 && tx <= 26 && ty >= 27 && ty <= 45) return "hub";
          return "grass";
        }

        function isBlockedPoint(x, y) {
          if (x < 8 || y < 8 || x > WORLD_W - 8 || y > WORLD_H - 8) return true;
          const tx = Math.floor(x / TILE);
          const ty = Math.floor(y / TILE);
          const terrain = terrainAt(tx, ty);
          if (terrain === "void" || terrain === "water") return true;
          return buildingDefs.some(({ block }) => x > block.x && x < block.x + block.w && y > block.y && y < block.y + block.h);
        }

        function isWaterPoint(x, y) {
          if (x < 8 || y < 8 || x > WORLD_W - 8 || y > WORLD_H - 8) return false;
          return terrainAt(Math.floor(x / TILE), Math.floor(y / TILE)) === "water";
        }

        function canMoveTo(x, y, w, h) {
          const foot = { x: x + w * 0.2, y: y + h * 0.78, w: w * 0.6, h: h * 0.18 };
          return !(
            isBlockedPoint(foot.x, foot.y) ||
            isBlockedPoint(foot.x + foot.w, foot.y) ||
            isBlockedPoint(foot.x, foot.y + foot.h) ||
            isBlockedPoint(foot.x + foot.w, foot.y + foot.h)
          );
        }

        function canSwimTo(x, y, w, h) {
          return (
            isWaterPoint(x + w * 0.24, y + h * 0.58) &&
            isWaterPoint(x + w * 0.5, y + h * 0.58) &&
            isWaterPoint(x + w * 0.76, y + h * 0.58) &&
            isWaterPoint(x + w * 0.5, y + h * 0.84)
          );
        }

        function nearestSwimPoint(x, y, w, h) {
          if (canSwimTo(x, y, w, h)) return { x, y };
          for (let radius = 1; radius <= 10; radius++) {
            for (let oy = -radius; oy <= radius; oy++) {
              for (let ox = -radius; ox <= radius; ox++) {
                if (Math.abs(ox) !== radius && Math.abs(oy) !== radius) continue;
                const nx = clamp(x + ox * (TILE / 2), 8, WORLD_W - w - 8);
                const ny = clamp(y + oy * (TILE / 2), 8, WORLD_H - h - 8);
                if (canSwimTo(nx, ny, w, h)) return { x: nx, y: ny };
              }
            }
          }
          return null;
        }

        function ensurePlayerOnWalkable(reason = "") {
          if (state.scene !== "outdoor" || canMoveTo(state.player.x, state.player.y, state.player.w, state.player.h)) return;
          const original = { x: state.player.x, y: state.player.y };
          for (let radius = 1; radius <= 8; radius++) {
            for (let oy = -radius; oy <= radius; oy++) {
              for (let ox = -radius; ox <= radius; ox++) {
                if (Math.abs(ox) !== radius && Math.abs(oy) !== radius) continue;
                const x = clamp(original.x + ox * TILE, 12, WORLD_W - state.player.w - 12);
                const y = clamp(original.y + oy * TILE, 12, WORLD_H - state.player.h - 12);
                if (!canMoveTo(x, y, state.player.w, state.player.h)) continue;
                state.player.x = x;
                state.player.y = y;
                addLog(`${reason || "位置"}校正：已移到最近的可行走區域。`);
                addToast("位置已校正到安全路面", "warn", 3.2);
                return;
              }
            }
          }
          state.player.x = 10 * TILE;
          state.player.y = 34 * TILE;
          addLog("位置校正：回到社區主路。");
          addToast("已返回社區主路", "warn", 3.2);
        }

        function canSpawnAt(point, options = {}) {
          const w = options.w || 28;
          const h = options.h || 28;
          const footX = point.x + w / 2;
          const footY = point.y + h;
          const terrain = terrainAt(Math.floor(footX / TILE), Math.floor(footY / TILE));
          if (options.allowWater) {
            if (terrain !== "water" || !canSwimTo(point.x, point.y, w, h)) return false;
          } else if (!canMoveTo(point.x, point.y, w, h)) {
            return false;
          }
          if (options.avoidBuildings !== false) {
            const visual = options.sprite ? spriteVisualRect(options.sprite, point.x, point.y, w, h) : { x: point.x, y: point.y, w, h };
            if (overlapsBuilding(visual, options.buildingMargin ?? 12)) return false;
          }
          return true;
        }

        function randomPointIn(area, options = {}) {
          for (let i = 0; i < 34; i++) {
            const point = {
              x: area.x + randRange(10, Math.max(11, area.w - 10)),
              y: area.y + randRange(10, Math.max(11, area.h - 10)),
            };
            if (canSpawnAt(point, options)) return point;
          }
          return null;
        }

        function cameraWorldRect(margin = 0) {
          return { x: state.camera.x - margin, y: state.camera.y - margin, w: canvas.width + margin * 2, h: canvas.height + margin * 2 };
        }

        function isOnCamera(entity, margin = 0) {
          return rectsOverlap({ x: entity.x, y: entity.y, w: entity.w || 1, h: entity.h || 1 }, cameraWorldRect(margin));
        }

        function localAnimalRect() {
          return cameraWorldRect(Math.max(canvas.width, canvas.height) * 0.78);
        }

        function animalAreas(def) {
          return def.areas || [def.area];
        }

        function animalSpeciesLimit(def) {
          if (def.rarity === "傳說") return 1;
          if (def.rarity === "稀有") return 2;
          if (def.rarity === "普通") return 3;
          return 5;
        }

        function animalCountFor(id) {
          return state.animals.filter((animal) => animal.id === id && !animal.leaving).length;
        }

        function randomAnimalPoint(def, w, h, options = {}) {
          const aquatic = def.id === "streamfish";
          const areas = options.localRect
            ? animalAreas(def).map((area) => intersectRect(area, options.localRect)).filter(Boolean)
            : animalAreas(def);
          if (!areas.length) return null;
          for (let i = 0; i < 96; i++) {
            const area = pick(areas);
            const insetX = Math.min(10, Math.max(2, area.w * 0.25));
            const insetY = Math.min(10, Math.max(2, area.h * 0.25));
            const point = {
              x: area.x + randRange(insetX, Math.max(insetX + 1, area.w - insetX)),
              y: area.y + randRange(insetY, Math.max(insetY + 1, area.h - insetY)),
            };
            if (!canSpawnAt(point, { allowWater: aquatic, w, h, sprite: def.sprite })) continue;
            const candidate = { x: point.x, y: point.y, w, h };
            if (options.offscreen && isOnCamera(candidate, ANIMAL_SCREEN_MARGIN)) continue;
            if (options.awayFromPlayer !== false && dist(candidate, state.player) < 220) continue;
            return point;
          }
          return null;
        }

        function scheduleNextAnimalSpawn(range = ANIMAL_SPAWN_DELAY) {
          state.animalSpawnTimer = randRange(range.min, range.max);
        }

        function scheduleLocalAnimalSpawn(range = LOCAL_ANIMAL_SPAWN_DELAY) {
          state.localAnimalSpawnTimer = randRange(range.min, range.max);
        }

        function spawnAnimal(options = {}) {
          const localRect = options.preferLocal ? localAnimalRect() : null;
          let candidates = animalDefs.filter((def) => def.condition(state) && animalCountFor(def.id) < animalSpeciesLimit(def));
          if (localRect) {
            const localCandidates = candidates.filter((def) => animalAreas(def).some((area) => intersectRect(area, localRect)));
            if (localCandidates.length) candidates = localCandidates;
          }
          if (!candidates.length || state.animals.length >= ANIMAL_MAX_COUNT) return false;
          const def = pick(candidates);
          const aquatic = def.id === "streamfish";
          const w = aquatic ? 34 : 30;
          const h = aquatic ? 20 : 28;
          const p = randomAnimalPoint(def, w, h, { offscreen: options.offscreen !== false, awayFromPlayer: options.awayFromPlayer, localRect });
          if (!p) return false;
          state.animals.push({
            uid: crypto.randomUUID ? crypto.randomUUID() : `a_${Date.now()}_${Math.random()}`,
            id: def.id,
            x: p.x,
            y: p.y,
            w,
            h,
            target: randomAnimalPoint(def, w, h, { offscreen: false, awayFromPlayer: false, localRect }) || { x: p.x, y: p.y },
            wait: randRange(20, 160),
            life: randRange(ANIMAL_LIFE.min, ANIMAL_LIFE.max),
            mood: "wander",
            observed: false,
            leaving: false,
            animClock: Math.random(),
            animMoving: false,
            animFacing: "left",
          });
          uiDirty = true;
          return true;
        }

        function spawnEvent() {
          const candidates = eventDefs.filter((def) => (!def.nightOnly || isNight(state.time)) && (def.id !== "light" || state.ecology.pollution < 85) && state.events.filter((event) => event.id === def.id).length < 2);
          if (!candidates.length || state.events.length > 14) return;
          const def = pick(candidates);
          const p = randomPointIn(def.area, { w: 32, h: 32, sprite: def.sprite, buildingMargin: 18 });
          if (!p) return;
          state.events.push({
            uid: crypto.randomUUID ? crypto.randomUUID() : `e_${Date.now()}_${Math.random()}`,
            id: def.id,
            x: p.x,
            y: p.y,
            w: 32,
            h: 32,
            life: randRange(320, 620),
            pulse: Math.random() * Math.PI * 2,
          });
        }

        function randomRoadPoint() {
          for (let i = 0; i < 80; i++) {
            const tx = Math.floor(randRange(5, MAP_W - 5));
            const ty = Math.floor(randRange(8, MAP_H - 7));
            if (!isPathTile(tx, ty)) continue;
            const point = {
              x: tx * TILE + randRange(3, 12),
              y: ty * TILE + randRange(2, 10),
            };
            if (canSpawnAt(point, { w: 26, h: 24, sprite: "trash", buildingMargin: 20 })) return point;
          }
          return randomPointIn(zones[0].rect, { w: 26, h: 24, sprite: "trash", buildingMargin: 20 });
        }

        function randomTrashTransformTime() {
          return randRange(TRASH_TRANSFORM_DELAY.min, TRASH_TRANSFORM_DELAY.max);
        }

        function scheduleNextTrashSpawn(range = TRASH_SPAWN_DELAY) {
          state.trashSpawnTimer = randRange(range.min, range.max);
        }

        function normalizeTrash(trash) {
          if (!trash || !trashTypes.some((type) => type.id === trash.type)) return null;
          const transform = clamp(
            Number(trash.transform) || randomTrashTransformTime(),
            TRASH_TRANSFORM_DELAY.min,
            TRASH_TRANSFORM_DELAY.max
          );
          return {
            ...trash,
            uid: trash.uid || makeUid("trash"),
            w: Number(trash.w) || 26,
            h: Number(trash.h) || 24,
            age: clamp(Number(trash.age) || 0, 0, Math.max(0, transform - 18)),
            transform,
            pulse: Number.isFinite(trash.pulse) ? trash.pulse : Math.random() * Math.PI * 2,
          };
        }

        function spawnRoadTrash() {
          if (state.trash.length >= TRASH_MAX_ACTIVE) return false;
          if (state.trash.length + state.monsters.length >= TRASH_MAX_PRESSURE) return false;
          const p = randomRoadPoint();
          if (!p) return false;
          const type = pick(trashTypes);
          state.trash.push({
            uid: makeUid("trash"),
            type: type.id,
            x: p.x,
            y: p.y,
            w: 26,
            h: 24,
            age: 0,
            transform: randomTrashTransformTime(),
            pulse: Math.random() * Math.PI * 2,
          });
          uiDirty = true;
          return true;
        }

        function monsterStageFor(absorbed) {
          if (absorbed >= 6) return 3;
          if (absorbed >= 3) return 2;
          return 1;
        }

        function monsterMaxHp(stage, absorbed) {
          return 18 + stage * 16 + absorbed * 3;
        }

        function monsterDetectRadius(monster) {
          return 130 + monster.stage * 48 + Math.min(monster.absorbed, 8) * 5;
        }

        function nearestTrashForMonster(monster, range) {
          let best = null;
          let bestDistance = Infinity;
          for (const trash of state.trash) {
            const d = dist(monster, trash);
            if (d < range && d < bestDistance) {
              best = trash;
              bestDistance = d;
            }
          }
          return best;
        }

        function createTrashMonster(x, y, trashHeld) {
          const absorbed = Math.max(1, trashHeld.length);
          const stage = monsterStageFor(absorbed);
          return {
            uid: makeUid("monster"),
            x,
            y,
            w: 28 + stage * 5,
            h: 28 + stage * 5,
            stage,
            absorbed,
            trashHeld: [...trashHeld],
            hp: monsterMaxHp(stage, absorbed),
            pulse: Math.random() * Math.PI * 2,
            target: null,
            wait: randRange(20, 90),
            mode: "idle",
          };
        }

        function evolveMonster(monster) {
          const nextStage = monsterStageFor(monster.absorbed);
          if (nextStage === monster.stage) return;
          monster.stage = nextStage;
          monster.w = 28 + nextStage * 5;
          monster.h = 28 + nextStage * 5;
          monster.hp = Math.min(monsterMaxHp(nextStage, monster.absorbed), (monster.hp || 0) + 18);
          addLog(`垃圾怪吸收垃圾，進階到第 ${nextStage} 階。`);
          uiDirty = true;
        }

        function transformTrashToMonster(trash) {
          state.trash = state.trash.filter((item) => item.uid !== trash.uid);
          state.monsters.push(createTrashMonster(trash.x, trash.y, [trash.type]));
          adjustEco({ pollution: 4, bio: -1 });
          addLog(`${trashDef(trash.type).name}放太久，變成第 1 階垃圾怪。`);
        }

        function updateTrash(dt) {
          for (const trash of [...state.trash]) {
            trash.age += dt;
            if (trash.age >= trash.transform) transformTrashToMonster(trash);
          }
          if (!Number.isFinite(state.trashSpawnTimer) || state.trashSpawnTimer <= 0) scheduleNextTrashSpawn();
          state.trashSpawnTimer -= dt;
          if (state.trashSpawnTimer > 0) return;
          const spawned = spawnRoadTrash();
          scheduleNextTrashSpawn(spawned ? TRASH_SPAWN_DELAY : TRASH_RETRY_DELAY);
        }

        function absorbNearbyTrash(monster) {
          for (let i = state.trash.length - 1; i >= 0; i--) {
            const trash = state.trash[i];
            if (dist(monster, trash) > 42) continue;
            state.trash.splice(i, 1);
            monster.trashHeld.push(trash.type);
            monster.absorbed += 1;
            monster.hp = Math.min(monsterMaxHp(monster.stage, monster.absorbed), monster.hp + 7);
            evolveMonster(monster);
          }
        }

        function updateMonsters(dt) {
          for (const monster of state.monsters) {
            absorbNearbyTrash(monster);
            const playerDistance = dist(monster, state.player);
            if (playerDistance <= monsterDetectRadius(monster)) {
              monster.mode = "chase";
              monster.target = null;
              moveToward(monster, state.player, 38 + monster.stage * 14, dt, { collide: true });
              if (!state.battle && dist(monster, state.player) < 34 + monster.stage * 4) startBattle(monster);
              continue;
            }

            const nearbyTrash = nearestTrashForMonster(monster, 150 + monster.stage * 38);
            if (nearbyTrash) {
              monster.mode = "forage";
              monster.target = nearbyTrash;
              moveToward(monster, nearbyTrash, 22 + monster.stage * 8, dt, { collide: true });
              continue;
            }

            monster.mode = "idle";
            if (monster.wait > 0) {
              monster.wait -= dt * 60;
              continue;
            }
            if (!monster.target || moveToward(monster, monster.target, 16 + monster.stage * 4, dt, { collide: true })) {
              monster.target = randomRoadPoint() || { x: monster.x, y: monster.y };
              monster.wait = randRange(24, 90);
            }
          }
        }

        function collectTrash(trash) {
          state.trash = state.trash.filter((item) => item.uid !== trash.uid);
          state.stats.trashCollected += 1;
          addTrashToBackpack(trash.type);
          addExperience(3, "撿起垃圾");
          adjustEco({ pollution: -1, bio: 0.4 });
          showDialogue("撿起垃圾", `${trashDef(trash.type).name}已放入背包。帶到回收場分類，可以換回收點數。`, 2.6);
          evaluateMissions();
        }

        function updateTime(dt) {
          const speed = state.speedOptions[state.speedIndex];
          const before = state.time;
          state.time += dt * 3.2 * speed;
          if (state.time >= DAY_MINUTES) {
            state.time -= DAY_MINUTES;
            state.day += 1;
            state.weather = pickNextWeather();
            const weatherLog = applyDailyWeatherEffect(state.weather);
            const restoredHealth = state.health < state.maxHealth;
            state.health = state.maxHealth;
            addLog(`第 ${state.day} 天開始，天氣：${state.weather}。${weatherLog}${restoredHealth ? " 體力已完全恢復。" : ""}`);
            if (restoredHealth) addToast("新的一天：體力已完全恢復", "good");
            for (let i = 0; i < 3; i++) spawnEvent();
          }
          if (Math.floor(before / 30) !== Math.floor(state.time / 30)) uiDirty = true;
        }

        function scheduleFor(npc) {
          const t = ((Math.floor(state.time) % DAY_MINUTES) + DAY_MINUTES) % DAY_MINUTES;
          return npc.schedule.find((slot) => t >= slot.from && t < slot.to) || npc.schedule[npc.schedule.length - 1];
        }

        function moveToward(entity, target, speed, dt, options = {}) {
          const dx = target.x - entity.x;
          const dy = target.y - entity.y;
          const d = Math.hypot(dx, dy);
          if (d < 2) return true;
          const step = Math.min(d, speed * dt);
          const nx = entity.x + (dx / d) * step;
          const ny = entity.y + (dy / d) * step;
          if (options.collide && entity.w && entity.h) {
            let moved = false;
            if (canMoveTo(nx, entity.y, entity.w, entity.h)) {
              entity.x = nx;
              moved = true;
            }
            if (canMoveTo(entity.x, ny, entity.w, entity.h)) {
              entity.y = ny;
              moved = true;
            }
            return d < 4 || (!moved && d < 10);
          }
          entity.x = nx;
          entity.y = ny;
          return false;
        }

        function moveSwimToward(entity, target, speed, dt) {
          const dx = target.x - entity.x;
          const dy = target.y - entity.y;
          const d = Math.hypot(dx, dy);
          if (d < 2) return true;
          const step = Math.min(d, speed * dt);
          const nx = entity.x + (dx / d) * step;
          const ny = entity.y + (dy / d) * step;
          const candidates = [
            { x: nx, y: ny },
            { x: nx, y: entity.y },
            { x: entity.x, y: ny },
          ]
            .filter((candidate) => canSwimTo(candidate.x, candidate.y, entity.w, entity.h))
            .sort((a, b) => Math.hypot(target.x - a.x, target.y - a.y) - Math.hypot(target.x - b.x, target.y - b.y));
          if (!candidates.length) return true;
          entity.x = candidates[0].x;
          entity.y = candidates[0].y;
          return false;
        }

        function moveAnimalToward(animal, def, target, speed, dt) {
          if (def.id === "streamfish") return moveSwimToward(animal, target, speed, dt);
          return moveToward(animal, target, speed, dt, { collide: true });
        }

        function updateNpcs(dt) {
          for (const npc of state.npcs) {
            const slot = scheduleFor(npc);
            npc.currentAct = slot.act;
            moveToward(npc, slot, 52, dt, { collide: true });
          }
        }

        function updateAnimalAnimationState(animal, beforeX, beforeY, dt) {
          const moved = Math.hypot(animal.x - beforeX, animal.y - beforeY);
          animal.animMoving = moved > 0.12;
          if (animal.animMoving) {
            animal.animClock = (animal.animClock || 0) + dt;
            if (Math.abs(animal.x - beforeX) > 0.04) animal.animFacing = animal.x > beforeX ? "right" : "left";
          } else {
            animal.animClock = (animal.animClock || 0) + dt * 0.12;
          }
        }

        function updateAnimals(dt) {
          for (const animal of state.animals) {
            const def = animalDefs.find((item) => item.id === animal.id);
            if (!def) continue;
            const beforeX = animal.x;
            const beforeY = animal.y;
            const aquatic = def.id === "streamfish";
            if (aquatic && !canSwimTo(animal.x, animal.y, animal.w, animal.h)) {
              const rescue = nearestSwimPoint(animal.x, animal.y, animal.w, animal.h);
              if (rescue) {
                animal.x = rescue.x;
                animal.y = rescue.y;
                animal.target = randomAnimalPoint(def, animal.w, animal.h, { offscreen: false, awayFromPlayer: false }) || animal.target;
              }
            }
            animal.life -= dt;
            if (animal.life <= 0 && !animal.leaving) {
              animal.leaving = true;
              animal.wait = 0;
              animal.mood = "leaving";
              animal.target = randomAnimalPoint(def, animal.w, animal.h, { offscreen: true, awayFromPlayer: false }) || animal.target;
            }
            if (animal.leaving) {
              if (!animal.target || moveAnimalToward(animal, def, animal.target, 34, dt)) {
                animal.target = randomAnimalPoint(def, animal.w, animal.h, { offscreen: true, awayFromPlayer: false }) || animal.target;
              }
            } else if (animal.wait > 0) {
              animal.wait -= dt * 60;
            } else if (!animal.target || moveAnimalToward(animal, def, animal.target, 18 + hash(animal.x | 0, animal.y | 0) * 26, dt)) {
              animal.target = randomAnimalPoint(def, animal.w, animal.h, { offscreen: false, awayFromPlayer: false }) || { x: animal.x, y: animal.y };
              animal.wait = randRange(40, 170);
            }
            updateAnimalAnimationState(animal, beforeX, beforeY, dt);
          }
          const before = state.animals.length;
          state.animals = state.animals.filter((animal) => animal.life > 0 || isOnCamera(animal, ANIMAL_SCREEN_MARGIN));
          if (state.animals.length !== before) uiDirty = true;
          if (!Number.isFinite(state.localAnimalSpawnTimer) || state.localAnimalSpawnTimer <= 0) scheduleLocalAnimalSpawn({ min: 0.5, max: 1.5 });
          state.localAnimalSpawnTimer -= dt;
          if (state.localAnimalSpawnTimer <= 0) {
            const localRect = localAnimalRect();
            const localAnimals = state.animals.filter((animal) => !animal.leaving && rectsOverlap(animal, localRect)).length;
            if (localAnimals < LOCAL_ANIMAL_TARGET && state.animals.length < ANIMAL_MAX_COUNT) {
              spawnAnimal({ offscreen: true, preferLocal: true });
            }
            scheduleLocalAnimalSpawn();
          }
          if (!Number.isFinite(state.animalSpawnTimer) || state.animalSpawnTimer <= 0) scheduleNextAnimalSpawn();
          state.animalSpawnTimer -= dt;
          if (state.animalSpawnTimer > 0) return;
          const wantsMore = state.animals.filter((animal) => !animal.leaving).length < ANIMAL_TARGET_COUNT;
          const spawned = wantsMore && (spawnAnimal({ offscreen: true, preferLocal: true }) || spawnAnimal({ offscreen: true }));
          scheduleNextAnimalSpawn(spawned ? ANIMAL_SPAWN_DELAY : ANIMAL_RETRY_DELAY);
        }

        function updateEvents(dt) {
          for (const event of state.events) event.life -= dt;
          state.events = state.events.filter((event) => event.life > 0 || dist(event, state.player) < 160);
          if (state.events.length < 8 && Math.random() < dt * 0.22) spawnEvent();
        }

        function updateFieldAction(dt) {
          const action = state.fieldAction;
          if (!action) return;
          action.time -= dt;
          action.meter += action.dir * dt * action.speed;
          if (action.meter <= 0) {
            action.meter = 0;
            action.dir = 1;
          } else if (action.meter >= 1) {
            action.meter = 1;
            action.dir = -1;
          }
          if (action.time <= 0) finishFieldAction(false);
        }

        function updatePlayer(dt) {
          if (state.fieldAction || state.battle || state.recycleGame) return;
          let dx = 0;
          let dy = 0;
          if (keys.has("arrowleft") || keys.has("a")) dx -= 1;
          if (keys.has("arrowright") || keys.has("d")) dx += 1;
          if (keys.has("arrowup") || keys.has("w")) dy -= 1;
          if (keys.has("arrowdown") || keys.has("s")) dy += 1;
          if (!dx && !dy) return;
          const len = Math.hypot(dx, dy) || 1;
          dx /= len;
          dy /= len;
          if (dx > 0) state.player.facing = "right";
          if (dx < 0) state.player.facing = "left";
          if (Math.abs(dx) > Math.abs(dy)) state.player.dir = dx > 0 ? "right" : "left";
          else state.player.dir = dy > 0 ? "down" : "up";
          const speed = state.player.speed * state.speedOptions[state.speedIndex] * (keys.has("shift") ? 1.42 : 1);
          const nx = state.player.x + dx * speed * dt;
          const ny = state.player.y + dy * speed * dt;
          const canMove = state.scene === "interior" ? canMoveInterior : canMoveTo;
          if (canMove(nx, state.player.y, state.player.w, state.player.h)) state.player.x = nx;
          if (canMove(state.player.x, ny, state.player.w, state.player.h)) state.player.y = ny;
        }

        function updateCamera() {
          if (state.scene === "interior") {
            state.camera.x = 0;
            state.camera.y = 0;
            return;
          }
          state.camera.x = clamp(state.player.x - canvas.width / 2, 0, WORLD_W - canvas.width);
          const topUiSafeZone = Math.min(86, canvas.height * 0.13);
          state.camera.y = clamp(state.player.y - canvas.height / 2 - topUiSafeZone, 0, WORLD_H - canvas.height);
        }

        function getAnimalProgress(id) {
          if (!state.progress[id]) state.progress[id] = { trust: 0, seen: false, partnered: false };
          return state.progress[id];
        }

        function nearestInteractable() {
          const candidates = [];
          if (state.scene === "interior") {
            const exit = interiorExitRect();
            const d = dist(state.player, exit);
            return d < 72 ? { type: "exit", ref: exit, distance: d } : null;
          }
          for (const building of buildingDefs) {
            const door = buildingDoorRect(building);
            const d = dist(state.player, door);
            if (d < 82) candidates.push({ type: "building", ref: building, distance: d, priority: 3 });
          }
          for (const animal of state.animals) {
            const d = dist(state.player, animal);
            if (d < 58) candidates.push({ type: "animal", ref: animal, distance: d, priority: 1 });
          }
          for (const event of state.events) {
            const d = dist(state.player, event);
            if (d < 62) candidates.push({ type: "event", ref: event, distance: d, priority: 0 });
          }
          for (const trash of state.trash) {
            const d = dist(state.player, trash);
            if (d < 52) candidates.push({ type: "trash", ref: trash, distance: d, priority: 0 });
          }
          for (const npc of state.npcs) {
            const d = dist(state.player, npc);
            if (d < 60) candidates.push({ type: "npc", ref: npc, distance: d, priority: 2 });
          }
          candidates.sort((a, b) => a.priority - b.priority || a.distance - b.distance);
          return candidates[0] || null;
        }

        function interact() {
          if (!state.started) {
            resetGame();
            return;
          }
          if (state.fieldAction) {
            const diff = Math.abs(state.fieldAction.meter - state.fieldAction.target);
            finishFieldAction(diff <= state.fieldAction.window / 2, diff <= state.fieldAction.window / 5);
            return;
          }
          const target = nearestInteractable();
          if (!target) {
            showDialogue("系統", "附近沒有可互動對象。試著靠近垃圾、動物、自然事件、回收場或居民。", 2.2);
            return;
          }
          if (target.type === "animal") observeAnimal(target.ref);
          if (target.type === "event") startFieldAction(target.ref);
          if (target.type === "trash") collectTrash(target.ref);
          if (target.type === "npc") talkToNpc(target.ref);
          if (target.type === "building") {
            if (target.ref.facility === "recycle") startRecycleGame();
            else enterInterior(target.ref);
          }
          if (target.type === "exit") exitInterior();
        }

        function observeAnimal(actor) {
          const def = animalDefs.find((animal) => animal.id === actor.id);
          const progress = getAnimalProgress(def.id);
          if (actor.observed) {
            actor.mood = "curious";
            actor.wait = Math.max(actor.wait || 0, 90);
            const trustText = progress.partnered ? "已是你的生態夥伴" : `信任 ${progress.trust} / ${def.trustGoal}`;
            showDialogue(`${def.name}｜已記錄`, `這隻${def.name}已經記錄過了。${trustText}；想累積經驗和信任，需要去找其他個體或新的觀察事件。`, 3.2);
            return;
          }
          const firstSeen = !progress.seen;
          actor.observed = true;
          state.stats.animalsObserved += 1;
          progress.seen = true;
          const trustGain = state.completedMissions["wildlife-log"] ? 2 : 1;
          progress.trust = clamp(progress.trust + trustGain, 0, def.trustGoal);
          actor.mood = "curious";
          actor.wait = 180;
          unlockCard(def.card);
          addNotes(firstSeen ? 12 : 5, firstSeen ? "新物種觀察" : "重複觀察");
          adjustEco(def.habitat.includes("溪") || def.habitat.includes("水") ? { water: 2, pollution: -1, bio: 2 } : { forest: 2, bio: 2 });
          let text = def.observe;
          if (!progress.partnered && progress.trust >= def.trustGoal) {
            progress.partnered = true;
            text += ` ${def.name}成為生態夥伴，解鎖夥伴技能「${def.skill}」。`;
            addLog(`${def.name}成為你的生態夥伴。`);
          } else {
            text += ` 信任 ${progress.trust} / ${def.trustGoal}。`;
            if (trustGain > 1) text += " 觀察筆記讓信任累積更快。";
          }
          showDialogue(`${def.name}｜${def.habitat}`, text, 4.8);
          evaluateMissions();
          uiDirty = true;
        }

        function startFieldAction(event) {
          const def = eventDefs.find((item) => item.id === event.id);
          if (state.health < FIELD_ACTION_HEALTH_COST) {
            addToast(`體力不足：需要 ${FIELD_ACTION_HEALTH_COST} 體力`, "bad", 2.4);
            showDialogue("體力不足", `至少需要 ${FIELD_ACTION_HEALTH_COST} 體力才能進行「${def.name}」。等到新的一天會恢復全部體力。`, 3.2);
            return;
          }
          const helper = eventHasHelper(def);
          const toolBonus = state.completedMissions["field-care"] ? 0.04 : 0;
          state.health = Math.max(0, state.health - FIELD_ACTION_HEALTH_COST);
          addToast(`體力 -${FIELD_ACTION_HEALTH_COST}`, "warn", 1.8);
          state.fieldAction = {
            uid: event.uid,
            def,
            meter: Math.random(),
            dir: Math.random() < 0.5 ? -1 : 1,
            target: randRange(0.32, 0.68),
            window: (helper ? 0.28 : 0.19) + toolBonus,
            speed: helper ? 0.74 : 0.92,
            time: (helper ? 8 : 6.5) + (toolBonus ? 0.6 : 0),
            helper,
          };
          state.dialogue = null;
          dialogueEl.hidden = true;
          if (helper) addToast("夥伴技能讓判定更穩", "good", 2.2);
        }

        function finishFieldAction(success, perfect = false) {
          const action = state.fieldAction;
          if (!action) return;
          const event = state.events.find((item) => item.uid === action.uid);
          const def = action.def;
          state.fieldAction = null;
          if (!event) return;
          if (!success) {
            addLog(`${def.name}處理失敗，先記下位置，稍後再試。`);
            showDialogue(def.name, "這次判定失敗。現實中的環境工作也需要安全、耐心和第二次嘗試。", 3.2);
            event.life = Math.max(event.life, 120);
            return;
          }
          state.events = state.events.filter((item) => item.uid !== event.uid);
          state.stats.eventsResolved += 1;
          const mult = perfect ? 1.35 : 1;
          adjustEco(def.delta, mult);
          unlockCard(def.id === "runoff" || def.id === "sample" ? "指標生物" : "日常綠地");
          addNotes(perfect ? 18 : 12, perfect ? "完整修復" : "環境行動");
          if (def.id === "litter") addTrashBundleToBackpack(["plastic", "paper", "general"], "清理分類物");
          showDialogue(def.name, `${def.note}${perfect ? " 處理得很完整，資料也更可用。" : ""}`, 4.5);
          evaluateMissions();
        }

        function getBattleAudio() {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtor) return null;
          if (!battleAudio || battleAudio.state === "closed") battleAudio = new AudioCtor();
          if (!musicGain) {
            musicGain = battleAudio.createGain();
            musicGain.connect(battleAudio.destination);
          }
          if (!sfxGain) {
            sfxGain = battleAudio.createGain();
            sfxGain.connect(battleAudio.destination);
          }
          applyAudioSettings();
          if (battleAudio.state === "suspended") {
            const resumed = battleAudio.resume();
            if (resumed?.catch) resumed.catch(() => {});
          }
          return battleAudio;
        }

        function playTone(audio, startFreq, endFreq, duration, type = "square", volume = 0.08, delay = 0, destination = null) {
          const now = audio.currentTime + delay;
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(destination || sfxGain || audio.destination);
          osc.start(now);
          osc.stop(now + duration + 0.04);
        }

        function playNoiseBurst(audio, duration = 0.12, volume = 0.08, filterFreq = 1200, delay = 0, destination = null) {
          const now = audio.currentTime + delay;
          const length = Math.max(1, Math.floor(audio.sampleRate * duration));
          const buffer = audio.createBuffer(1, length, audio.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length);
          const source = audio.createBufferSource();
          const filter = audio.createBiquadFilter();
          const gain = audio.createGain();
          source.buffer = buffer;
          filter.type = "bandpass";
          filter.frequency.setValueAtTime(filterFreq, now);
          filter.Q.setValueAtTime(0.9, now);
          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          source.connect(filter);
          filter.connect(gain);
          gain.connect(destination || sfxGain || audio.destination);
          source.start(now);
        }

        function playBattleSound(kind, power = 1) {
          const audio = getBattleAudio();
          if (!audio) return;
          const boost = clamp(power, 0.75, 2.2);
          try {
            if (kind === "strike") {
              playTone(audio, 320, 90, 0.12, "sawtooth", 0.09 * boost);
              playNoiseBurst(audio, 0.11, 0.08 * boost, 1700);
            } else if (kind === "analyze") {
              playTone(audio, 520, 690, 0.08, "triangle", 0.06 * boost);
              playTone(audio, 780, 980, 0.09, "triangle", 0.05 * boost, 0.08);
            } else if (kind === "partner") {
              playTone(audio, 410, 650, 0.12, "sine", 0.06 * boost);
              playTone(audio, 620, 920, 0.16, "sine", 0.045 * boost, 0.07);
            } else if (kind === "defend") {
              playTone(audio, 170, 245, 0.18, "triangle", 0.07 * boost);
              playTone(audio, 245, 310, 0.16, "triangle", 0.04 * boost, 0.06);
            } else if (kind === "enemy") {
              playTone(audio, 130, 58, 0.22, "sawtooth", 0.075 * boost);
              playNoiseBurst(audio, 0.18, 0.08 * boost, 520);
            } else if (kind === "victory") {
              [392, 523, 659].forEach((freq, index) => playTone(audio, freq, freq * 1.2, 0.18, "triangle", 0.055, index * 0.08));
            } else if (kind === "defeat") {
              playTone(audio, 260, 130, 0.22, "sawtooth", 0.075);
              playTone(audio, 180, 84, 0.26, "sawtooth", 0.055, 0.14);
            }
          } catch (err) {
            console.warn(err);
          }
        }

        function normalizedVolume() {
          const value = Number(state.settings?.volume);
          return Number.isFinite(value) ? clamp(value, 0, 1) : 0.7;
        }

        function applyAudioSettings() {
          const volume = normalizedVolume();
          if (musicGain && battleAudio) {
            const target = state.started ? volume * (state.paused ? 0.08 : 0.2) : 0;
            musicGain.gain.setTargetAtTime(target, battleAudio.currentTime, 0.16);
          }
          if (sfxGain && battleAudio) {
            sfxGain.gain.setTargetAtTime(volume * 0.86, battleAudio.currentTime, 0.04);
          }
        }

        function scheduleMusicNote(audio, freq, start, duration, volume = 0.12, type = "triangle", destination = musicGain) {
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(volume, start + 0.018);
          gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
          osc.connect(gain);
          gain.connect(destination || audio.destination);
          osc.start(start);
          osc.stop(start + duration + 0.05);
        }

        function scheduleMusicPad(audio, freqs, start, duration) {
          freqs.forEach((freq, index) => {
            scheduleMusicNote(audio, freq, start + index * 0.035, duration, 0.028, "sine", musicGain);
          });
        }

        function scheduleBackgroundMusicStep(audio, step, start) {
          const loopStep = step % MUSIC_LOOP_STEPS;
          const phraseStep = loopStep % MUSIC_MELODY.length;
          const beat = MUSIC_BEAT_SECONDS;
          const melody = MUSIC_MELODY[phraseStep];
          const chord = MUSIC_CHORDS[Math.floor(loopStep / 8) % MUSIC_CHORDS.length];

          if (phraseStep % 8 === 0) {
            scheduleMusicPad(audio, chord, start, beat * 7.4);
          }
          if (phraseStep % 4 === 0) {
            scheduleMusicNote(audio, chord[0] * 0.5, start + 0.02, beat * 3.2, 0.035, "sine", musicGain);
          }
          if (melody) {
            scheduleMusicNote(audio, melody, start, beat * 1.55, 0.06, "triangle", musicGain);
            if (phraseStep % 16 === 10) {
              scheduleMusicNote(audio, melody * 1.5, start + beat * 0.48, beat * 0.9, 0.024, "sine", musicGain);
            }
          }
          if (phraseStep % 16 === 14) {
            scheduleMusicNote(audio, chord[1] * 2, start, beat * 1.8, 0.022, "sine", musicGain);
          }
        }

        function playMusicStep() {
          if (!state.started || !battleAudio || !musicGain) return;
          const audio = battleAudio;
          if (!musicNextStepTime || musicNextStepTime < audio.currentTime) musicNextStepTime = audio.currentTime + 0.05;
