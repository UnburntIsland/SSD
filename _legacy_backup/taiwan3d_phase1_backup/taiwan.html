<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>森循島 — 台灣 3D</title>
<style>
 html,body{margin:0;height:100%;background:#0d1622;overflow:hidden;font-family:"Noto Sans TC",system-ui,sans-serif}
 #hud{position:fixed;left:12px;top:12px;color:#eef4fb;background:rgba(10,18,28,.55);padding:10px 13px;border-radius:9px;font-size:13px;line-height:1.7;max-width:46vw}
 #region{font-size:17px;font-weight:800;color:#9fe3c0}
 #info{color:#bcd; font-size:12px}
 #ctrls{margin-top:6px}
 #err{position:fixed;left:12px;bottom:12px;color:#ffb0a0;font-size:12px;white-space:pre-wrap}
 #tip{position:fixed;right:12px;bottom:12px;color:#cfe;background:rgba(10,18,28,.5);padding:6px 10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
 <div id="hud">
   <div id="region">台灣</div>
   <div id="info">—</div>
   <div id="ctrls">
     高度誇張 <input id="hs" type="range" min="0.4" max="3" step="0.1" value="1"> <span id="hsv">1.0</span>
     · 俯角 <input id="el" type="range" min="18" max="85" step="1" value="54"> <span id="elv">54°</span>
     · <label><input id="dc" type="checkbox"> 日夜循環</label>
   </div>
 </div>
 <div id="tip">WASD/方向鍵 移動 · 拖曳轉鏡頭 · 滾輪縮放</div>
 <div id="err"></div>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
 <script src="data_island.js"></script>
 <script src="js/util.js"></script>
 <script src="js/config.js"></script>
 <script src="js/heightmap.js"></script>
 <script src="js/terrain.js"></script>
 <script src="js/vegetation.js"></script>
 <script src="js/lighting.js"></script>
 <script src="js/regions.js"></script>
 <script src="js/camera.js"></script>
 <script src="js/player.js"></script>
 <script src="js/ui.js"></script>
 <script src="js/main.js"></script>
</body>
</html>
